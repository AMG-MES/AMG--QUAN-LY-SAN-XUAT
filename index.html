<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#C96A20"/>
  <title>Xưởng Đồng · MES</title>
  <link rel="manifest" href="manifest.json"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0D1117;color:#E6EDF3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    #root{min-height:100vh}
    #splash{position:fixed;inset:0;background:#0D1117;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:20px;z-index:9999;
      transition:opacity .35s ease}
    .sp-logo{width:76px;height:76px;border-radius:20px;
      background:linear-gradient(135deg,#C96A20,#E07B39);
      display:flex;align-items:center;justify-content:center;font-size:38px;
      box-shadow:0 0 48px rgba(201,106,32,.45)}
    .sp-title{font-size:22px;font-weight:800;letter-spacing:-.02em}
    .sp-sub{font-size:13px;color:#8B949E}
    .sp-bar{width:220px;height:3px;background:#1E2630;border-radius:3px;overflow:hidden}
    .sp-fill{height:100%;background:linear-gradient(90deg,#C96A20,#E07B39);
      border-radius:3px;animation:ld 4s ease-out forwards}
    @keyframes ld{0%{width:0}50%{width:70%}90%{width:92%}100%{width:95%}}
  </style>
</head>
<body>
  <!-- Splash — ẩn ngay khi React mount xong -->
  <div id="splash">
    <div class="sp-logo">🏭</div>
    <div class="sp-title">XƯỞNG ĐỒNG · MES</div>
    <div class="sp-sub" id="sp-status">Đang tải thư viện...</div>
    <div class="sp-bar"><div class="sp-fill"></div></div>
  </div>

  <div id="root"></div>

  <script>
    function setStatus(t){ var e=document.getElementById('sp-status'); if(e)e.textContent=t; }
  </script>

  <!-- Thư viện (CDN, được SW cache lần đầu → lần sau instant) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"
    onload="setStatus('React ✓')" onerror="setStatus('❌ Không tải được React — cần internet lần đầu')"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.8.0/umd/Recharts.min.js" onerror="window.Recharts={}"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" onerror="window.XLSX={}"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.7.0/firebase-app-compat.min.js" onerror=""></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.7.0/firebase-firestore-compat.min.js" onerror=""></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.7.0/firebase-auth-compat.min.js" onerror=""></script>

  <script>
    window.XLSX = window.XLSX || {};
    window.Recharts = window.Recharts || {};

    /* ═══════════════════════════════════════════════════════
       ★  ĐIỀN FIREBASE CONFIG VÀO ĐÂY  ★
       Firebase Console → Project Settings → Web app → Config
       Bỏ trống = chạy offline với localStorage
    ═══════════════════════════════════════════════════════ */
    var _FB = {
      apiKey:            "",
      authDomain:        "",
      projectId:         "",
      storageBucket:     "",
      messagingSenderId: "",
      appId:             ""
    };

    try {
      if(typeof firebase!=='undefined' && _FB.apiKey){
        firebase.initializeApp(_FB);
        window.__db   = firebase.firestore();
        window.__auth = firebase.auth();
        window.__db.settings({experimentalAutoDetectLongPolling:true});
        console.log('✅ Firebase OK');
      }
    } catch(e){ console.warn('Firebase:',e.message); }

    setStatus('Khởi động ứng dụng...');
  </script>

  <!-- App đã được pre-compile → không cần Babel runtime → NHANH -->
  <script src="app.js" onerror="document.getElementById('sp-status').textContent='❌ Không tải được app.js'"></script>

  <!-- Service Worker -->
  <script>
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
  </script>
</body>
</html>
