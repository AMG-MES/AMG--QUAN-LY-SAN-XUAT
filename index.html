// Gộp số liệu nền từ đơn hàng (theo Ngày xuống đơn) với số liệu nhập trực tiếp qua
// Tổng quan (theo ngày nhập thực tế) cho một công đoạn cụ thể, theo từng mã liệu.
// Không đếm trùng: phần "nền" lấy hiện tại trừ đi phần đã được ghi nhận qua Tổng quan.
function aggregateStageByMaterial(orders, auditLog, stageKey, granularity, allowedMaterials) {
  const matchesAllowed = (mat) => !allowedMaterials || allowedMaterials.includes(mat);
  const relevantOrders = orders.filter(o => matchesAllowed(o.materialCode || "Khác"));
  const liveEntries = (auditLog || []).filter(a => a.type === "production_entry" && a.stageKey === stageKey && a.date && typeof a.qty === "number" && matchesAllowed(a.materialCode || "Khác"));
  const buckets = {};
  const materials = new Set();
  function addToBucket(key, label, mat, qty) {
    if (!qty) return;
    materials.add(mat);
    if (!buckets[key]) buckets[key] = { key, label, total: 0 };
    buckets[key][mat] = (buckets[key][mat] || 0) + qty;
    buckets[key].total += qty;
  }
  relevantOrders.forEach(o => {
    const currentDone = o.stages?.[stageKey]?.done || 0;
    const loggedForOrder = liveEntries.filter(a => a.targetId === o.id).reduce((s, a) => s + (a.qty || 0), 0);
    const baseline = Math.round((currentDone - loggedForOrder) * 100) / 100;
    if (baseline > 0) {
      const mat = o.materialCode || "Khác";
      if (o.orderDate) {
        const key = getBucketKey(o.orderDate, granularity);
        addToBucket(key, getBucketLabel(key, granularity), mat, baseline);
      } else {
        addToBucket("unknown", "Không rõ ngày", mat, baseline);
      }
    }
  });
  liveEntries.forEach(e => {
    const key = getBucketKey(e.date, granularity);
    addToBucket(key, getBucketLabel(key, granularity), e.materialCode || "Khác", e.qty);
  });
  const sortedKeys = Object.keys(buckets).filter(k => k !== "unknown").sort();
  if (buckets["unknown"]) sortedKeys.push("unknown");
  const materialList = [...materials].sort();
  return {
    data: sortedKeys.map(k => buckets[k]),
    materials: materialList,
    totalKg: sortedKeys.reduce((a, k) => a + buckets[k].total, 0),
    entryCount: liveEntries.length,
  };
}

// Gộp sản lượng theo loại dây (Dây cứng / Dây ủ mềm) - đây là phân loại do người
// dùng tự chọn khi nhập sản lượng tại công đoạn Kéo trung. Số liệu nền có sẵn từ
// đơn hàng (chưa từng được phân loại khi nhập) sẽ rơi vào nhóm "Chưa phân loại".
function aggregateStageByWireType(orders, auditLog, stageKey, granularity) {
  const liveEntries = (auditLog || []).filter(a => a.type === "production_entry" && a.stageKey === stageKey && a.date && typeof a.qty === "number");
  const buckets = {};
  const types = new Set();
  function addToBucket(key, label, type, qty) {
    if (!qty) return;
    types.add(type);
    if (!buckets[key]) buckets[key] = { key, label, total: 0 };
    buckets[key][type] = (buckets[key][type] || 0) + qty;
    buckets[key].total += qty;
  }
  orders.forEach(o => {
    const currentDone = o.stages?.[stageKey]?.done || 0;
    const loggedForOrder = liveEntries.filter(a => a.targetId === o.id).reduce((s, a) => s + (a.qty || 0), 0);
    const baseline = Math.round((currentDone - loggedForOrder) * 100) / 100;
    if (baseline > 0) {
      if (o.orderDate) {
        const key = getBucketKey(o.orderDate, granularity);
        addToBucket(key, getBucketLabel(key, granularity), "Chưa phân loại", baseline);
      } else {
        addToBucket("unknown", "Không rõ ngày", "Chưa phân loại", baseline);
      }
    }
  });
  liveEntries.forEach(e => {
    const key = getBucketKey(e.date, granularity);
    addToBucket(key, getBucketLabel(key, granularity), e.wireType || "Chưa phân loại", e.qty);
  });
  const sortedKeys = Object.keys(buckets).filter(k => k !== "unknown").sort();
  if (buckets["unknown"]) sortedKeys.push("unknown");
  const typeOrder = ["Dây cứng", "Dây ủ mềm", "Chưa phân loại"];
  const typeList = [...types].sort((a, b) => typeOrder.indexOf(a) - typeOrder.indexOf(b));
  return {
    data: sortedKeys.map(k => buckets[k]),
    materials: typeList,
    totalKg: sortedKeys.reduce((a, k) => a + buckets[k].total, 0),
    entryCount: liveEntries.length,
  };
}

// Kết hợp 2 chiều: Mã liệu (A/B/C) × Loại dây (Dây cứng/Dây ủ mềm) thành các cột
// riêng, ví dụ "A - Dây mềm", "A - Dây cứng"... Chỉ tính các lượt nhập MỚI qua
// Tổng quan có đủ cả 2 thông tin (mã liệu hợp lệ + loại dây đã chọn); số liệu nền
// cũ từ đơn hàng không có loại dây nên không thể xếp vào bảng kết hợp này.
function aggregateStageByMaterialAndWireType(orders, auditLog, stageKey, granularity, allowedMaterials) {
  const orderById = {};
  orders.forEach(o => { orderById[o.id] = o; });
  // Tất cả lượt nhập có phân loại loại dây cho công đoạn này (chưa lọc theo mã liệu) —
  // dùng để tính đúng phần "đã ghi nhận" của mỗi đơn, tránh đếm trùng với số liệu nền.
  const allWireEntries = (auditLog || []).filter(a =>
    a.type === "production_entry" && a.stageKey === stageKey && a.date && typeof a.qty === "number" && a.wireType
  );
  // Mã liệu hiển thị LUÔN lấy theo đơn hàng HIỆN TẠI (không dùng mã liệu lưu cũ trong nhật
  // ký từ lúc nhập — vì đơn có thể đã được sửa mã liệu sau đó), để tránh sót dữ liệu.
  function resolveMat(e) { return orderById[e.targetId]?.materialCode || e.materialCode || ""; }
  const liveEntries = allWireEntries.filter(a => allowedMaterials.includes(resolveMat(a)));
  const buckets = {};
  const combos = new Set();
  function addToBucket(key, label, combo, qty) {
    if (!qty) return;
    combos.add(combo);
    if (!buckets[key]) buckets[key] = { key, label, total: 0 };
    buckets[key][combo] = (buckets[key][combo] || 0) + qty;
    buckets[key].total += qty;
  }
  // 1) Số liệu nền: đơn hàng đã được đánh dấu "Dây cứng"/"Dây ủ mềm" (vd qua ô tick khi
  // chỉnh sửa đơn) nhưng KHÔNG đi qua nhật ký nhập liệu ở Tổng quan — vẫn cần tính vào
  // báo cáo này, trừ phần đã được ghi nhận qua Tổng quan (allWireEntries, không lọc mã
  // liệu) để tránh đếm trùng.
  const wireTypeFull = { "cứng": "Dây cứng", "mềm": "Dây ủ mềm" };
  orders.forEach(o => {
    if (stageKey !== "keo_trung" || !o.wireFinish) return;
    const mat = o.materialCode || "";
    if (!allowedMaterials.includes(mat)) return;
    const currentDone = o.stages?.[stageKey]?.done || 0;
    const loggedForOrder = allWireEntries.filter(a => a.targetId === o.id).reduce((s, a) => s + (a.qty || 0), 0);
    const baseline = Math.round((currentDone - loggedForOrder) * 100) / 100;
    if (baseline > 0) {
      const combo = `${mat} - ${wireTypeFull[o.wireFinish] || o.wireFinish}`;
      if (o.orderDate) {
        const key = getBucketKey(o.orderDate, granularity);
        addToBucket(key, getBucketLabel(key, granularity), combo, baseline);
      } else {
        addToBucket("unknown", "Không rõ ngày", combo, baseline);
      }
    }
  });
  // 2) Số liệu nhập trực tiếp qua Tổng quan (theo đúng ngày nhập thực tế)
  liveEntries.forEach(e => {
    const mat = resolveMat(e);
    const combo = `${mat} - ${e.wireType}`;
    const key = getBucketKey(e.date, granularity);
    addToBucket(key, getBucketLabel(key, granularity), combo, e.qty);
  });
  const sortedKeys = Object.keys(buckets).filter(k => k !== "unknown").sort();
  if (buckets["unknown"]) sortedKeys.push("unknown");
  const comboOrder = [];
  allowedMaterials.forEach(mat => { comboOrder.push(`${mat} - Dây ủ mềm`); comboOrder.push(`${mat} - Dây cứng`); });
  const comboList = comboOrder.filter(c => combos.has(c));
  return {
    data: sortedKeys.map(k => buckets[k]),
    materials: comboList,
    totalKg: sortedKeys.reduce((a, k) => a + buckets[k].total, 0),
    entryCount: liveEntries.length,
  };
}

// Gộp số liệu PHẾ LIỆU (lấy từ bảng "Ghi nhận phế liệu") theo mã nguyên liệu A/B/C
// và theo thời gian (ngày/tuần/tháng), cho một công đoạn cụ thể.
function aggregateScrapByMaterial(scrap, stageKey, granularity, allowedMaterials) {
  const relevant = (scrap || []).filter(s => s.stage === stageKey && s.date && typeof s.qty === "number" && allowedMaterials.includes(s.materialCode || ""));
  const buckets = {};
  const materials = new Set();
  function addToBucket(key, label, mat, qty) {
    if (!qty) return;
    materials.add(mat);
    if (!buckets[key]) buckets[key] = { key, label, total: 0 };
    buckets[key][mat] = (buckets[key][mat] || 0) + qty;
    buckets[key].total += qty;
  }
  relevant.forEach(s => {
    const key = getBucketKey(s.date, granularity);
    addToBucket(key, getBucketLabel(key, granularity), s.materialCode, s.qty);
  });
  const sortedKeys = Object.keys(buckets).sort();
  const materialList = allowedMaterials.filter(m => materials.has(m));
  return {
    data: sortedKeys.map(k => buckets[k]),
    materials: materialList,
    totalKg: sortedKeys.reduce((a, k) => a + buckets[k].total, 0),
    entryCount: relevant.length,
  };
}

function ProductionEntryEditModal({ entry, onClose, onSave }) {
  const [qty, setQty] = useState(entry.qty);
  const [materialCode, setMaterialCode] = useState(entry.materialCode || "");
  const [wireType, setWireType] = useState(entry.wireType || "");
  const [date, setDate] = useState(entry.date || "");
  return (
    <Modal title={`Chỉnh sửa lượt nhập — ${entry.customer} / ${entry.spec}`} onClose={onClose} width={420}>
      <Field label="Ngày"><input className="mes-input" type="date" value={date} onChange={e => setDate(e.target.value)} /></Field>
      <Field label="Số lượng (kg)"><input className="mes-input" type="number" min="0" step="0.1" value={qty} onChange={e => setQty(e.target.value === "" ? "" : parseFloat(e.target.value) || 0)} /></Field>
      <Field label="Mã liệu"><input className="mes-input" value={materialCode} onChange={e => setMaterialCode(e.target.value)} placeholder="A / B / C..." /></Field>
      {entry.stageKey === "keo_trung" && (
        <Field label="Loại dây">
          <div style={{ display: "flex", gap: 8 }}>
            {["Dây cứng", "Dây ủ mềm"].map(t => (
              <button key={t} type="button" onClick={() => setWireType(t)} className="mes-btn" style={{
                flex: 1, justifyContent: "center",
                borderColor: wireType === t ? COLORS.copper : COLORS.border,
                background: wireType === t ? `${COLORS.copper}22` : COLORS.bgPanel2,
                color: wireType === t ? COLORS.copperBright : COLORS.textDim,
              }}>{t}</button>
            ))}
          </div>
        </Field>
      )}
      <Button variant="primary" onClick={() => { onSave(entry.id, parseFloat(qty) || 0, materialCode, wireType, date); onClose(); }} style={{ width: "100%", justifyContent: "center" }}>
        <Save size={14} /> Lưu thay đổi
      </Button>
    </Modal>
  );
}

function ProductionEntriesManager({ auditLog, stageKey, onEdit, onDelete }) {
  const { askConfirm } = useDialog();
  const [open, setOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const entries = useMemo(() =>
    (auditLog || []).filter(a => a.type === "production_entry" && a.stageKey === stageKey).sort((a, b) => new Date(b.date) - new Date(a.date)),
    [auditLog, stageKey]
  );
  if (entries.length === 0) return null;
  return (
    <div style={{ marginTop: 16, marginBottom: 4 }}>
      <button onClick={() => setOpen(o => !o)} className="mes-btn" style={{
        display: "flex", alignItems: "center", gap: 8, width: "100%", justifyContent: "space-between",
        borderColor: COLORS.copper, background: `${COLORS.copper}14`, padding: "10px 14px",
      }}>
        <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <Pencil size={14} color={COLORS.copper} />
          <span style={{ fontSize: 13, fontWeight: 700, color: COLORS.copperBright }}>
            Sửa / xóa các lượt nhập sản lượng đã ghi ({entries.length})
          </span>
        </span>
        {open ? <ChevronUp size={15} color={COLORS.copper} /> : <ChevronDown size={15} color={COLORS.copper} />}
      </button>
      {open && (
        <div style={{ marginTop: 10 }}>
          <div className="mes-scroll-x" style={{ maxHeight: 320, overflowY: "auto" }}>
            <table className="mes-table">
              <thead><tr><th>Ngày</th><th>Khách hàng / Quy cách</th><th>Mã liệu</th><th>Loại dây</th><th style={{ textAlign: "right" }}>Số lượng</th><th></th></tr></thead>
              <tbody>
                {entries.map(e => (
                  <tr key={e.id}>
                    <td className="mes-mono">{fmtDate(e.date)}</td>
                    <td>{e.customer} / {e.spec}</td>
                    <td className="mes-mono">{e.materialCode || "—"}</td>
                    <td>{e.wireType || "—"}</td>
                    <td className="mes-mono" style={{ textAlign: "right" }}>{fmtNum(e.qty)}</td>
                    <td style={{ display: "flex", gap: 4 }}>
                      <IconButton icon={Pencil} onClick={() => setEditing(e)} title="Sửa" />
                      <IconButton icon={Trash2} danger onClick={async () => { if (await askConfirm(`Xóa lượt nhập ${fmtNum(e.qty)}kg — ${e.customer}/${e.spec}?`, { danger: true, confirmLabel: "Xóa" })) onDelete(e.id); }} title="Xóa" />
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
      {editing && <ProductionEntryEditModal entry={editing} onClose={() => setEditing(null)} onSave={onEdit} />}
    </div>
  );
}

          </thead>
          <tbody>
            {agg.data.map(row => (
              <tr key={row.key}>
                <td style={{ fontWeight: 600 }}>{row.label}</td>

              <td style={{ fontWeight: 700, borderTop: `2px solid ${COLORS.border}` }}>Tổng cộng</td>

function ReportsPage({ orders, machines, scrap, timeseries, auditLog, onEditProductionEntry, onDeleteProductionEntry }) {
  const [customerFilter, setCustomerFilter] = useState("all");
  const [keoTrungGranularity, setKeoTrungGranularity] = useState("day");

  const liveStageData = useMemo(() => STAGES.map(s => ({
    name: s.short, fullName: s.label,
    value: orders.reduce((a, o) => a + (o.stages?.[s.key]?.done || 0), 0),
  })), [orders]);

  const historicalData = useMemo(() => timeseries.map((t, i) => ({
    ky: "Kỳ " + (i + 1),
    "Kéo trung": t.keo_trung, "Kéo tinh": t.keo_tinh, "Kéo siêu tinh": t.keo_sieu_tinh,
    "Ủ nhiệt": t.u_nhiet, "Mạ thiếc": t.ma_thiec, "Bện": t.ben,
  })), [timeseries]);

  const statusDist = useMemo(() => {
    const m = { "Đang sản xuất": 0, "Hoàn thành": 0, "Chưa bắt đầu": 0 };
    orders.forEach(o => { m[orderProgress(o).statusLabel] = (m[orderProgress(o).statusLabel] || 0) + 1; });
    return Object.entries(m).map(([name, value]) => ({ name, value })).filter(d => d.value > 0);
  }, [orders]);

  const machineDist = useMemo(() => {
    const m = { running: 0, idle: 0, maintenance: 0, broken: 0 };
    machines.forEach(mm => m[mm.status]++);
    return Object.entries(m).map(([k, v]) => ({ name: MACHINE_STATUS[k].label, value: v, color: MACHINE_STATUS[k].color })).filter(d => d.value > 0);
  }, [machines]);

  const scrapByDate = useMemo(() => {
    const m = {};
    scrap.forEach(s => { m[s.date] = (m[s.date] || 0) + (s.qty || 0); });
    return Object.entries(m).sort(([a], [b]) => new Date(a) - new Date(b)).map(([date, qty]) => ({ date: fmtDate(date), qty }));
  }, [scrap]);

  const customers = useMemo(() => [...new Set(orders.map(o => o.customer).filter(Boolean))].sort((a, b) => a.localeCompare(b)), [orders]);

  const byCustomerData = useMemo(() => {
    const m = {};
    orders.forEach(o => {
      const key = o.customer || "Khác";
      if (!m[key]) m[key] = { customer: key, "Đã làm": 0, "Còn lại": 0, soDon: 0 };
      const prog = orderProgress(o);
      m[key]["Đã làm"] += prog.completedQty;
      m[key]["Còn lại"] += prog.remainingQty !== null ? Math.max(0, prog.remainingQty) : 0;
      m[key].soDon += 1;
    });
    return Object.values(m).sort((a, b) => (b["Đã làm"] + b["Còn lại"]) - (a["Đã làm"] + a["Còn lại"]));
  }, [orders]);

  const orderDetailData = useMemo(() => {
    const filtered = customerFilter === "all" ? orders : orders.filter(o => o.customer === customerFilter);
    return filtered.map(o => {
      const prog = orderProgress(o);
      return {
        name: `${o.customer} · ${o.spec}`,
        pct: prog.pct === null ? 0 : Math.round(Math.min(100, prog.pct) * 10) / 10,
        statusLabel: prog.statusLabel,
        color: prog.statusColor,
        remainingQty: prog.remainingQty,
      };
    }).sort((a, b) => a.pct - b.pct);
  }, [orders, customerFilter]);

  const VALID_MATERIAL_GRADES = ["A", "B", "C"];
  const keoTrungDay = useMemo(() => aggregateStageByMaterial(orders, auditLog, "keo_trung", "day", VALID_MATERIAL_GRADES), [orders, auditLog]);
  const keoTrungWeek = useMemo(() => aggregateStageByMaterial(orders, auditLog, "keo_trung", "week", VALID_MATERIAL_GRADES), [orders, auditLog]);
  const keoTrungMonth = useMemo(() => aggregateStageByMaterial(orders, auditLog, "keo_trung", "month", VALID_MATERIAL_GRADES), [orders, auditLog]);
  const keoTrungByMaterial = keoTrungGranularity === "day" ? keoTrungDay : keoTrungGranularity === "week" ? keoTrungWeek : keoTrungMonth;

  const keoTrungWireDay = useMemo(() => aggregateStageByMaterialAndWireType(orders, auditLog, "keo_trung", "day", VALID_MATERIAL_GRADES), [orders, auditLog]);
  const keoTrungWireWeek = useMemo(() => aggregateStageByMaterialAndWireType(orders, auditLog, "keo_trung", "week", VALID_MATERIAL_GRADES), [orders, auditLog]);
  const keoTrungWireMonth = useMemo(() => aggregateStageByMaterialAndWireType(orders, auditLog, "keo_trung", "month", VALID_MATERIAL_GRADES), [orders, auditLog]);

  const keoTrungScrapDay = useMemo(() => aggregateScrapByMaterial(scrap, "keo_trung", "day", VALID_MATERIAL_GRADES), [scrap]);
  const keoTrungScrapWeek = useMemo(() => aggregateScrapByMaterial(scrap, "keo_trung", "week", VALID_MATERIAL_GRADES), [scrap]);
  const keoTrungScrapMonth = useMemo(() => aggregateScrapByMaterial(scrap, "keo_trung", "month", VALID_MATERIAL_GRADES), [scrap]);

  return (
    <div>
      <SectionHeading eyebrow="Real-time" title="Báo cáo & biểu đồ so sánh theo thời gian" action={
        <Badge color={COLORS.green}><span className="pulse-dot">●</span> Tự động cập nhật</Badge>
      } />
      <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 16, marginBottom: 16 }}>
        <ChartCard title="Sản lượng hiện tại theo công đoạn" eyebrow="Tổng hợp từ đơn hàng đang mở">
          <BarChart data={liveStageData}>
            <CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} vertical={false} />
            <XAxis dataKey="name" tick={{ fill: COLORS.textFaint, fontSize: 11 }} axisLine={{ stroke: COLORS.border }} tickLine={false} />
            <YAxis tick={{ fill: COLORS.textFaint, fontSize: 11 }} axisLine={false} tickLine={false} />
            <Tooltip contentStyle={{ background: COLORS.bgPanel2, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }} labelFormatter={(l, p) => p?.[0]?.payload?.fullName || l} />
            <Bar dataKey="value" fill={COLORS.copper} radius={[5, 5, 0, 0]} />
          </BarChart>
        </ChartCard>
        <ChartCard title="Phân bố trạng thái đơn hàng" eyebrow={`${orders.length} đơn hàng`}>
          <PieChart>
            <Pie data={statusDist} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius={85} innerRadius={48} paddingAngle={2}>
              {statusDist.map((d, i) => <Cell key={i} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
            </Pie>
            <Tooltip contentStyle={{ background: COLORS.bgPanel2, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }} />
            <Legend wrapperStyle={{ fontSize: 12, color: COLORS.textDim }} />
          </PieChart>
        </ChartCard>
      </div>

      <div style={{ marginBottom: 16 }}>
        <ChartCard title="Sản lượng theo từng khách hàng" eyebrow={`${customers.length} khách hàng`} height={Math.max(260, byCustomerData.length * 34)}>
          <BarChart data={byCustomerData} layout="vertical" margin={{ left: 10 }}>
            <CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} horizontal={false} />
            <XAxis type="number" tick={{ fill: COLORS.textFaint, fontSize: 11 }} axisLine={{ stroke: COLORS.border }} tickLine={false} />
            <YAxis type="category" dataKey="customer" width={150} tick={{ fill: COLORS.text, fontSize: 12 }} axisLine={false} tickLine={false} />
            <Tooltip contentStyle={{ background: COLORS.bgPanel2, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }} />
            <Legend wrapperStyle={{ fontSize: 11.5 }} />
            <Bar dataKey="Đã làm" stackId="a" fill={COLORS.green} radius={[0, 0, 0, 0]} />
            <Bar dataKey="Còn lại" stackId="a" fill={COLORS.amber} radius={[0, 4, 4, 0]} />
          </BarChart>
        </ChartCard>
      </div>

      <div style={{ marginBottom: 16 }}>
        <ChartCard
          title="Tiến độ chi tiết theo từng đơn hàng"
          eyebrow={`${orderDetailData.length} đơn hàng${customerFilter !== "all" ? " · " + customerFilter : ""}`}
          height={Math.max(220, orderDetailData.length * 30)}
        >
          {orderDetailData.length === 0 ? <EmptyState title="Không có đơn hàng" /> : (
            <BarChart data={orderDetailData} layout="vertical" margin={{ left: 10 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} horizontal={false} />
              <XAxis type="number" domain={[0, 100]} unit="%" tick={{ fill: COLORS.textFaint, fontSize: 11 }} axisLine={{ stroke: COLORS.border }} tickLine={false} />
              <YAxis type="category" dataKey="name" width={220} tick={{ fill: COLORS.text, fontSize: 11.5 }} axisLine={false} tickLine={false} />
              <Tooltip
                contentStyle={{ background: COLORS.bgPanel2, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }}
                formatter={(value, name, props) => [`${value}% — ${props.payload.statusLabel}`, "Tiến độ"]}
              />
              <Bar dataKey="pct" radius={[0, 4, 4, 0]}>
                {orderDetailData.map((d, i) => <Cell key={i} fill={d.color} />)}
              </Bar>
            </BarChart>
          )}
        </ChartCard>
        <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 10 }}>
          <select className="mes-input" style={{ width: 260 }} value={customerFilter} onChange={e => setCustomerFilter(e.target.value)}>
            <option value="all">Tất cả khách hàng</option>
            {customers.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>

      <div style={{ marginBottom: 16 }}>
        <div className="mes-card" style={{ padding: 18 }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>

              </div>

              <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.red, textTransform: "uppercase", letterSpacing: ".03em", marginBottom: 8 }}>
                <Recycle size={13} style={{ marginRight: 4, verticalAlign: -2 }} />Phế liệu Kéo trung theo mã nguyên liệu (A/B/C)
              </div>
              <EmptyState icon={Recycle} title="Chưa có dữ liệu phế liệu Kéo trung mang mã A/B/C"

            <Line type="monotone" dataKey="Bện" stroke={COLORS.green} dot={false} strokeWidth={2} />
            <Line type="monotone" dataKey="Kéo trung" stroke={COLORS.amber} dot={false} strokeWidth={2} />

        </ChartCard>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 16 }}>
        <ChartCard title="Xu hướng phế liệu theo ngày" eyebrow={`${scrap.length} lượt ghi nhận`}>
          {scrapByDate.length === 0 ? <EmptyState icon={TrendingUp} title="Chưa có đủ dữ liệu" /> : (
            <AreaChart data={scrapByDate}>
              <CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} vertical={false} />
              <XAxis dataKey="date" tick={{ fill: COLORS.textFaint, fontSize: 11 }} axisLine={{ stroke: COLORS.border }} tickLine={false} />
              <YAxis tick={{ fill: COLORS.textFaint, fontSize: 11 }} axisLine={false} tickLine={false} />
              <Tooltip contentStyle={{ background: COLORS.bgPanel2, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }} />
              <Area type="monotone" dataKey="qty" stroke={COLORS.red} fill={`${COLORS.red}33`} strokeWidth={2} />
            </AreaChart>
          )}
        </ChartCard>
        <ChartCard title="Tình trạng máy móc thiết bị" eyebrow={`${machines.length} máy`}>
          <PieChart>
            <Pie data={machineDist} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius={85} innerRadius={48} paddingAngle={2}>
              {machineDist.map((d, i) => <Cell key={i} fill={d.color} />)}
            </Pie>
            <Tooltip contentStyle={{ background: COLORS.bgPanel2, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }} />
            <Legend wrapperStyle={{ fontSize: 12, color: COLORS.textDim }} />
          </PieChart>
        </ChartCard>
      </div>

      {/* ===== BIỂU ĐỒ TỪNG CÔNG ĐOẠN ===== */}
      {(() => {
        const stageData = STAGES.map(s => {
          const production = orders.reduce((a, o) => a + (o.stages?.[s.key]?.done || 0), 0);
          const scrapForStage = scrap.filter(sc => sc.stage === s.key);
          const scrapQty = scrapForStage.reduce((a, sc) => a + (sc.qty || 0), 0);
          const pctScrap = production + scrapQty > 0 ? ((scrapQty / (production + scrapQty)) * 100).toFixed(2) : null;
          const scrapColor = pctScrap === null ? COLORS.textFaint : parseFloat(pctScrap) > 5 ? COLORS.red : parseFloat(pctScrap) > 2 ? COLORS.amber : COLORS.green;
          const scrapDailyMap = {};
          scrapForStage.forEach(sc => { scrapDailyMap[sc.date] = (scrapDailyMap[sc.date] || 0) + (sc.qty || 0); });
          const scrapDailyArr = Object.entries(scrapDailyMap).sort(([a], [b]) => new Date(a) - new Date(b)).map(([date, qty]) => ({ date: fmtDate(date), qty }));
          const byCustomerMap = {};
          orders.forEach(o => { const done = o.stages?.[s.key]?.done || 0; if (done > 0) byCustomerMap[o.customer] = (byCustomerMap[o.customer] || 0) + done; });
          const byCustomer = Object.entries(byCustomerMap).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value).slice(0, 10);
          return { stage: s, production, scrapQty, pctScrap, scrapColor, scrapDailyArr, byCustomer };
        }).filter(d => d.production > 0 || d.scrapQty > 0);
        if (stageData.length === 0) return null;
        return (
          <>
            <SectionHeading eyebrow="Chi tiết từng công đoạn" title="Sản lượng & phế liệu theo từng công đoạn" />
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              {stageData.map(({ stage: s, production, scrapQty, pctScrap, scrapColor, scrapDailyArr, byCustomer }) => (
                <div key={s.key} className="mes-card" style={{ padding: 18 }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
                    <div>
                      <div className="mes-mono" style={{ fontSize: 11, color: COLORS.copper, letterSpacing: ".07em", textTransform: "uppercase", marginBottom: 3 }}>Công đoạn</div>
                      <div className="mes-display" style={{ fontSize: 18, fontWeight: 700 }}>{s.label}</div>
                    </div>
                    <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
                      <div style={{ textAlign: "right" }}>
                        <div style={{ fontSize: 11, color: COLORS.textFaint }}>Sản lượng</div>
                        <div className="mes-mono" style={{ fontWeight: 700, fontSize: 18, color: COLORS.green }}>{fmtNum(production)} kg</div>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        <div style={{ fontSize: 11, color: COLORS.textFaint }}>Phế liệu</div>
                        <div className="mes-mono" style={{ fontWeight: 700, fontSize: 18, color: COLORS.red }}>{fmtNum(scrapQty)} kg</div>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        <div style={{ fontSize: 11, color: COLORS.textFaint }}>Tỷ lệ phế</div>
                        <div className="mes-mono" style={{ fontWeight: 700, fontSize: 18, color: scrapColor }}>{pctScrap !== null ? pctScrap + "%" : "—"}</div>
                      </div>
                    </div>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 16 }}>
                    <div>
                      <div style={{ fontSize: 12, color: COLORS.textDim, fontWeight: 600, marginBottom: 8 }}>Sản lượng theo khách hàng</div>
                      {byCustomer.length === 0 ? <EmptyState icon={BarChart3} title="Chưa có dữ liệu" /> : (
                        <ResponsiveContainer width="100%" height={Math.max(140, byCustomer.length * 30)}>
                          <BarChart data={byCustomer} layout="vertical">
                            <CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} horizontal={false} />
                            <XAxis type="number" tick={{ fill: COLORS.textFaint, fontSize: 10 }} axisLine={{ stroke: COLORS.border }} tickLine={false} />
                            <YAxis type="category" dataKey="name" width={90} tick={{ fill: COLORS.text, fontSize: 11 }} axisLine={false} tickLine={false} />
                            <Tooltip contentStyle={{ background: COLORS.bgPanel2, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }} />
                            <Bar dataKey="value" fill={COLORS.copper} radius={[0, 4, 4, 0]} name="Sản lượng (kg)" />
                          </BarChart>
                        </ResponsiveContainer>
                      )}
                    </div>
                    <div>
                      <div style={{ fontSize: 12, color: COLORS.textDim, fontWeight: 600, marginBottom: 8 }}>Xu hướng phế liệu theo ngày</div>
                      {scrapDailyArr.length === 0 ? <EmptyState icon={Recycle} title="Chưa có phế liệu" hint={`Vào Chất lượng & Phế liệu → Ghi nhận tại ${s.label}.`} /> : (
                        <ResponsiveContainer width="100%" height={Math.max(140, byCustomer.length * 30)}>
                          <AreaChart data={scrapDailyArr}>
                            <CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} vertical={false} />
                            <XAxis dataKey="date" tick={{ fill: COLORS.textFaint, fontSize: 10 }} axisLine={{ stroke: COLORS.border }} tickLine={false} />
                            <YAxis tick={{ fill: COLORS.textFaint, fontSize: 10 }} axisLine={false} tickLine={false} />
                            <Tooltip contentStyle={{ background: COLORS.bgPanel2, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }} />
                            <Area type="monotone" dataKey="qty" stroke={COLORS.red} fill={`${COLORS.red}33`} strokeWidth={2} name="Phế liệu (kg)" />
                          </AreaChart>
                        </ResponsiveContainer>
                      )}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </>
        );
      })()}
    </div>
  );
}


/* ===================== KÉO TRUNG PAGE ===================== */
function KeoTrungPage({ orders, auditLog, currentUser, onSubmit, onEditEntry, onDeleteEntry }) {
  const { askConfirm } = useDialog();
  const VALID_GRADES = ["A", "B", "C"];
  const [materialCode, setMaterialCode] = useState("A");
  const [wireType, setWireType] = useState("");
  const [diameter, setDiameter] = useState("");
  const [customer, setCustomer] = useState("");
  const [qty, setQty] = useState("");
  const [note, setNote] = useState("Ca ngày");
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
  const [msg, setMsg] = useState("");
  const [showEntries, setShowEntries] = useState(false);
  const [editing, setEditing] = useState(null);

  function handleSubmit() {
    const n = parseFloat(qty);
    if (!n || n <= 0) { setMsg("Số lượng phải lớn hơn 0."); return; }
    if (!wireType) { setMsg("Vui lòng chọn Dây cứng hoặc Dây ủ mềm."); return; }
    onSubmit({ stageKey: "keo_trung", qty: n, note, wireType, materialCode, diameter, customer, date });
    setQty(""); setDiameter(""); setCustomer(""); setMsg("Đã ghi nhận thành công.");
    setTimeout(() => setMsg(""), 3000);
  }

  // Tổng hợp sản lượng theo mã liệu + loại dây
  const entries = useMemo(() =>
    (auditLog || []).filter(a => a.type === "production_entry" && a.stageKey === "keo_trung" && a.date && typeof a.qty === "number")
      .sort((a, b) => new Date(b.date) - new Date(a.date)),
    [auditLog]
  );
  const summary = useMemo(() => {
    const m = {};
    VALID_GRADES.forEach(g => {
      m[g + " - Dây ủ mềm"] = 0;
      m[g + " - Dây cứng"] = 0;
    });
    entries.forEach(e => {
      const mat = e.materialCode || "";
      const combo = `${mat} - ${e.wireType || ""}`;
      if (m[combo] !== undefined) m[combo] += e.qty;
    });
    return Object.entries(m).filter(([, v]) => v > 0).map(([k, v]) => ({ label: k, qty: v }));
  }, [entries]);
  const totalKg = entries.reduce((a, e) => a + (e.qty || 0), 0);

  // Đơn hàng đang cần nguyên liệu từ Kéo trung + mã liệu tương ứng
  const ordersByMat = useMemo(() => {
    const m = {};
    orders.forEach(o => {
      const mat = o.materialCode || "";
      if (!VALID_GRADES.includes(mat)) return;
      const qty = o.quantity || 0;
      const applicable = getApplicableStages(o);
      const isSoftWire = applicable.length === 1 && applicable[0] === "keo_trung";
      let remainingNeed;
      if (isSoftWire) {
        // Dây ủ mềm: còn cần = số lượng - Kéo trung đã làm trực tiếp
        remainingNeed = Math.max(0, qty - (o.stages?.keo_trung?.done || 0));
      } else {
        // Đơn thường (BC/TC/bện): còn cần Kéo trung = qty - keo_trung.done (NVL đã kéo cho đơn này)
        // Nếu chưa có keo_trung.done, dùng downstream làm sàn (phần Kéo tinh đã làm
        // chắc chắn đã được Kéo trung cung cấp rồi, tránh tính lại)
        const keoTrungDone = o.stages?.keo_trung?.done || 0;
        const downstreamDone = Math.max(
          o.stages?.keo_tinh?.done || 0,
          o.stages?.keo_sieu_tinh?.done || 0
        );
        // Lấy max(keo_trung.done, downstream) để tránh trường hợp downstream > keo_trung
        const alreadySupplied = Math.max(keoTrungDone, downstreamDone);
        remainingNeed = Math.max(0, qty - alreadySupplied);
      }
      if (remainingNeed > 0) {
        if (!m[mat]) m[mat] = [];
        m[mat].push({ ...o, _remainingNeed: remainingNeed, _isSoftWire: isSoftWire });
      }
    });
    return m;
  }, [orders]);

  return (
    <div>
      <SectionHeading eyebrow="Công đoạn cung cấp nguyên vật liệu" title="Nhập sản lượng Kéo trung" action={
        <Badge color={COLORS.green}><span className="pulse-dot">●</span> Tổng hợp: {fmtNum(totalKg)} kg</Badge>
      } />
      <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1.2fr) minmax(0,0.8fr)", gap: 18, marginBottom: 18 }}>
        {/* FORM NHẬP */}
        <div className="mes-card" style={{ padding: 18 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16 }}>
            <Hammer size={16} color={COLORS.copper} />
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ width: 38, height: 38, borderRadius: 10, background: `linear-gradient(135deg, ${COLORS.copperBright}, ${COLORS.copper})`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                <Hammer size={18} color="#1A0F08" />
              </div>
              <div>
                <div className="mes-mono" style={{ fontSize: 10.5, color: COLORS.copper, letterSpacing: ".08em", textTransform: "uppercase", marginBottom: 2 }}>Công đoạn Kéo trung</div>
                <div className="mes-display" style={{ fontSize: 20, fontWeight: 700, letterSpacing: "-0.02em" }}>Ghi nhận sản lượng</div>
              </div>
            </div>
          </div>
          <Field label="Ngày sản xuất">
            <input className="mes-input" type="date" value={date} onChange={e => setDate(e.target.value)} />
          </Field>
          <Field label="Mã nguyên liệu (A / B / C)">
            <div style={{ display: "flex", gap: 8 }}>
              {VALID_GRADES.map(g => (
                <button key={g} type="button" onClick={() => setMaterialCode(g)} className="mes-btn" style={{
                  flex: 1, justifyContent: "center", fontSize: 15, fontWeight: 700,
                  borderColor: materialCode === g ? COLORS.copper : COLORS.border,
                  background: materialCode === g ? `${COLORS.copper}22` : COLORS.bgPanel2,
                  color: materialCode === g ? COLORS.copperBright : COLORS.textDim,
                }}>{g}</button>
              ))}
            </div>
          </Field>
          <Field label="Loại dây">
            <div style={{ display: "flex", gap: 8 }}>
              {["Dây cứng", "Dây ủ mềm"].map(t => (
                <button key={t} type="button" onClick={() => setWireType(t)} className="mes-btn" style={{
                  flex: 1, justifyContent: "center",
                  borderColor: wireType === t ? COLORS.copper : COLORS.border,
                  background: wireType === t ? `${COLORS.copper}22` : COLORS.bgPanel2,
                  color: wireType === t ? COLORS.copperBright : COLORS.textDim,
                }}>{t}</button>
              ))}
            </div>
          </Field>
          {wireType && (
            <Field label={wireType === "Dây ủ mềm" ? "Khách hàng (Dây ủ mềm — thành phẩm tại đây)" : "Khách hàng (Dây cứng — theo dõi đơn hàng)"}>
              <div style={{ position: "relative" }}>
                <UserIcon size={14} style={{ position: "absolute", left: 10, top: 11, color: COLORS.textFaint }} />
                <input
                  className="mes-input"
                  style={{ paddingLeft: 30 }}
                  list="mes-kt-customers"
                  value={customer}
                  onChange={e => setCustomer(e.target.value)}
                  placeholder="Nhập tên khách hàng..."
                />
                <datalist id="mes-kt-customers">
                  {[...new Set(orders.map(o => o.customer).filter(Boolean))].sort().map(c => <option key={c} value={c} />)}
                </datalist>
              </div>
              <div style={{ fontSize: 11.5, color: wireType === "Dây ủ mềm" ? COLORS.amber : COLORS.blue, marginTop: 4 }}>
                {wireType === "Dây ủ mềm"
                  ? "Dây ủ mềm kéo trung xong là thành phẩm — sản lượng tính luôn vào thành phẩm của khách hàng này."
                  : customer ? "✓ Dây cứng + Khách hàng = Thành phẩm Kéo trung cho đơn hàng này — sản lượng cập nhật vào tiến độ đơn." : "Để trống = Phôi nội bộ cho Kéo tinh/Ủ nhiệt. Điền tên khách hàng = Thành phẩm Kéo trung của đơn đó."}
              </div>
            </Field>
          )}
          <Field label="Đường kính dây (mm)">
            <input
              className="mes-input"
              type="number"
              min="0"
              step="0.001"
              value={diameter}
              onChange={e => setDiameter(e.target.value)}
              placeholder="ví dụ: 0.254"
            />
          </Field>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Field label="Số lượng (kg)">
              <input className="mes-input" type="number" min="0" step="0.1" value={qty} onChange={e => setQty(e.target.value)} placeholder="ví dụ: 500" />
            </Field>
            <Field label="Ca sản xuất">
              <select className="mes-input" value={note} onChange={e => setNote(e.target.value)}>
                <option value="Ca ngày">Ca ngày</option>
                <option value="Ca đêm">Ca đêm</option>
              </select>
            </Field>
          </div>
          {msg && <div style={{ fontSize: 12.5, color: msg.includes("thành công") ? COLORS.green : COLORS.red, marginBottom: 10 }}>{msg}</div>}
          <Button variant="primary" onClick={handleSubmit} style={{ width: "100%", justifyContent: "center" }}>
            <Save size={14} /> Ghi nhận sản lượng Kéo trung
          </Button>
        </div>

        {/* TÓM TẮT + ĐƠN HÀNG CẦN NVL */}
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div className="mes-card" style={{ padding: 16 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.textDim, textTransform: "uppercase", letterSpacing: ".03em", marginBottom: 10 }}>Sản lượng đã kéo hôm nay & tổng hợp</div>
            {summary.length === 0 ? <EmptyState icon={Gauge} title="Chưa có dữ liệu" hint="Ghi nhận sản lượng bên trái để thấy tổng hợp." /> : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {summary.map(s => (
                  <div key={s.label} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 10px", background: COLORS.bgInset, borderRadius: 8 }}>
                    <span style={{ fontSize: 13, fontWeight: 600 }}>{s.label}</span>
                    <span className="mes-mono" style={{ fontWeight: 700, color: COLORS.copperBright }}>{fmtNum(s.qty)} kg</span>
                  </div>
                ))}
                <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 10px", borderTop: `1px solid ${COLORS.border}`, marginTop: 4 }}>
                  <span style={{ fontWeight: 700 }}>Tổng cộng</span>
                  <span className="mes-mono" style={{ fontWeight: 800, color: COLORS.copperBright }}>{fmtNum(totalKg)} kg</span>
                </div>
              </div>
            )}
          </div>
          {VALID_GRADES.map(g => {
            const needList = ordersByMat[g] || [];
            if (!needList.length) return null;
            const totalNeed = needList.reduce((a, o) => a + (o._remainingNeed || 0), 0);
            return (
              <div key={g} className="mes-card" style={{ padding: 14 }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.amber }}>
                    Mã {g} — {needList.length} đơn hàng đang cần nguyên liệu từ Kéo trung
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 10.5, color: COLORS.textFaint, marginBottom: 1 }}>Tổng cần kéo</div>
                    <div className="mes-mono" style={{ fontSize: 15, fontWeight: 800, color: COLORS.copperBright }}>{fmtNum(totalNeed)} kg</div>
                  </div>
                </div>
                {needList.slice(0, 5).map(o => (
                  <div key={o.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "5px 0", borderBottom: `1px solid ${COLORS.border}` }}>
                    <span style={{ fontWeight: 600 }}>{o.customer} · {o.spec}</span>
                    <span className="mes-mono" style={{ color: COLORS.amber, fontWeight: 700 }}>Còn {fmtNum(o._remainingNeed)} kg</span>
                  </div>
                ))}
                {needList.length > 4 && <div style={{ fontSize: 11, color: COLORS.textFaint, marginTop: 4 }}>+ {needList.length - 4} đơn khác...</div>}
                {needList.length > 1 && (
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "7px 0 0", borderTop: `2px solid ${COLORS.border}`, marginTop: 4 }}>
                    <span style={{ fontWeight: 700, color: COLORS.textDim }}>Tổng cộng Mã {g}</span>
                    <span className="mes-mono" style={{ fontWeight: 800, color: COLORS.copperBright }}>{fmtNum(totalNeed)} kg</span>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* LỊCH SỬ NHẬP */}
      <div className="mes-card" style={{ padding: 18 }}>
        <button onClick={() => setShowEntries(o => !o)} className="mes-btn" style={{
          width: "100%", justifyContent: "space-between", borderColor: COLORS.border, background: "transparent", padding: "8px 12px",
        }}>
          <span style={{ display: "flex", alignItems: "center", gap: 8, fontWeight: 700 }}>
            <History size={15} color={COLORS.blue} /> Lịch sử nhập Kéo trung ({entries.length} lượt)
          </span>
          {showEntries ? <ChevronUp size={15} /> : <ChevronDown size={15} />}
        </button>
        {showEntries && (
          <div className="mes-scroll-x" style={{ maxHeight: 360, overflowY: "auto", marginTop: 12 }}>
            {entries.length === 0 ? <EmptyState icon={History} title="Chưa có lượt nhập" /> : (
              <table className="mes-table">
                <thead><tr><th>Ngày</th><th>Mã liệu</th><th>ĐK dây (mm)</th><th>Loại dây / Khách hàng</th><th style={{ textAlign: "right" }}>Số lượng</th><th>Ca</th><th></th></tr></thead>
                <tbody>
                  {entries.map(e => (
                    <tr key={e.id}>
                      <td className="mes-mono">{fmtDate(e.date)}</td>
                      <td style={{ fontWeight: 700 }}>{e.materialCode || "—"}</td>
                      <td className="mes-mono">{e.diameter || "—"}</td>
                      <td>{e.wireType || "—"}{e.wireType === "Dây ủ mềm" && e.customer && <span style={{ color: COLORS.amber, marginLeft: 6, fontSize: 12 }}>({e.customer})</span>}</td>
                      <td className="mes-mono" style={{ textAlign: "right", fontWeight: 700, color: COLORS.copperBright }}>{fmtNum(e.qty)} kg</td>
                      <td style={{ color: COLORS.textFaint }}>{e.note || "—"}</td>
                      <td style={{ display: "flex", gap: 4 }}>
                        <IconButton icon={Pencil} onClick={() => setEditing(e)} title="Sửa" />
                        <IconButton icon={Trash2} danger onClick={async () => { if (await askConfirm(`Xóa lượt nhập ${fmtNum(e.qty)} kg — Mã ${e.materialCode} ${e.wireType}?`, { danger: true, confirmLabel: "Xóa" })) onDeleteEntry(e.id); }} title="Xóa" />
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        )}
      </div>
      {editing && <ProductionEntryEditModal entry={editing} onClose={() => setEditing(null)} onSave={onEditEntry} />}
    </div>

function UserFormModal({ initial, onClose, onSave, isNew }) {
  const [form, setForm] = useState({ ...initial, password: "" });
  const [err, setErr] = useState("");
  function submit() {
    if (!form.username.trim()) { setErr("Vui lòng nhập tên đăng nhập."); return; }
    if (isNew && !form.password) { setErr("Vui lòng nhập mật khẩu."); return; }
    const payload = { username: form.username.trim(), fullName: form.fullName.trim() || form.username, role: form.role, team: form.role === "employee" ? form.team : "" };
    if (form.password) payload.password = form.password;
    onSave(payload, isNew);
    onClose();
  }
  return (
    <Modal title={isNew ? "Tạo tài khoản mới" : `Chỉnh sửa tài khoản: ${initial.username}`} onClose={onClose} width={420}>
      <Field label="Tên đăng nhập">
        <input className="mes-input" disabled={!isNew} value={form.username}
          onChange={e => setForm(f => ({ ...f, username: e.target.value.replace(/\s+/g, ".") }))}
          placeholder="vi-du: to.keo (không dùng khoảng trắng)" />
        {isNew && form.username.includes(" ") && (
          <div style={{ fontSize: 11.5, color: COLORS.amber, marginTop: 4 }}>⚠️ Khoảng trắng được tự đổi thành dấu chấm để tránh nhầm khi đăng nhập.</div>
        )}
      </Field>
      <Field label="Họ và tên hiển thị"><input className="mes-input" value={form.fullName} onChange={e => setForm(f => ({ ...f, fullName: e.target.value }))} /></Field>
      <Field label={isNew ? "Mật khẩu" : "Đặt lại mật khẩu (để trống nếu không đổi)"}>
        <input className="mes-input" type="password" value={form.password} onChange={e => setForm(f => ({ ...f, password: e.target.value }))} />
      </Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Field label="Vai trò">
          <select className="mes-input" value={form.role} onChange={e => setForm(f => ({ ...f, role: e.target.value }))}>
            <option value="employee">Nhân viên</option>
            <option value="admin">Quản trị viên</option>
          </select>
        </Field>
        {form.role === "employee" && (
          <Field label="Tổ sản xuất">
            <select className="mes-input" value={form.team} onChange={e => setForm(f => ({ ...f, team: e.target.value }))}>
              {TEAMS.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </Field>
        )}
      </div>
      {err && <div style={{ color: COLORS.red, fontSize: 12.5, marginBottom: 10 }}>{err}</div>}
      <Button variant="primary" onClick={submit} style={{ width: "100%", justifyContent: "center" }}><Save size={14} /> Lưu tài khoản</Button>
    </Modal>
  );
}

function AppInner() {
  const data = useAppData();
  const { showAlert } = useDialog();
  const [currentUser, setCurrentUser] = useState(null);
  const [activeTab, setActiveTab] = useState("dashboard");
  const [collapsed, setCollapsed] = useState(false);

  useEffect(() => {
    if (!data.ready || !currentUser) return;
    const t = setInterval(() => { data.refreshAll(); }, 20000);
    return () => clearInterval(t);
  }, [data.ready, currentUser]); // eslint-disable-line

  if (!data.ready) return <LoadingScreen />;
  if (!currentUser) return <LoginScreen users={data.users} onLogin={setCurrentUser} storageError={data.storageError} />;

  const isAdmin = currentUser.role === "admin";

  function audit(type, detail, targetId, extra) {
    db.collection(FS.audit).add({ id: uid("AL"), type, detail, targetId, user: currentUser?.fullName||"system", ts: firebase.firestore.FieldValue.serverTimestamp(), ...extra }).catch(()=>{});
  }


  async function handleQuickEntry({ orderId, stageKey, qty, note, wireType }) {
    // onSnapshot keeps data.orders fresh
    const order = baseOrders.find(o => o.id === orderId);
    if (!order) return;
    const isSoftFinish = stageKey === "keo_trung" && wireType === "Dây ủ mềm";
    const next = baseOrders.map(o => {
      if (o.id !== orderId) return o;
      const st = o.stages[stageKey] || { done: 0, remain: 0 };
      const newDone = (st.done || 0) + qty;
      const newRemain = computeStageRemain(o.quantity, newDone);
      let updated = { ...o, stages: { ...o.stages, [stageKey]: { done: newDone, remain: newRemain !== null ? newRemain : (st.remain || 0) - qty } } };
      if (isSoftFinish) updated.wireFinish = "mềm"; // Dây ủ mềm tại Kéo trung = thành phẩm luôn
      else if (stageKey === "keo_trung" && wireType === "Dây cứng" && !o.wireFinish) updated.wireFinish = "cứng";
      // Đồng bộ lại Thành phẩm = sản lượng công đoạn cuối cùng trong quy trình của đơn này
      updated = normalizeOrderStages(updated);
      return updated;
    });
    await data.persistOrders(next);
    audit("production_entry",
      `Nhập ${fmtNum(qty)} cho công đoạn "${STAGE_MAP[stageKey].label}" — đơn ${order.customer} / ${order.spec}${note ? " · " + note : ""}${wireType ? " · " + wireType : ""}${isSoftFinish ? " (đã thành phẩm)" : ""}`,
      orderId,
      { stageKey, qty, materialCode: order.materialCode || "Khác", customer: order.customer, spec: order.spec, date: new Date().toISOString().slice(0, 10), wireType });
  }


  async function handleEditProductionEntry(entryId, newQty, newMaterialCode, newWireType, newDate) {
    const freshLog = data.auditLog;
    const entry = freshLog.find(e => e.id === entryId);
    if (!entry) return;
    // onSnapshot keeps data.orders fresh
    const delta = newQty - entry.qty;
    const nextOrders = baseOrders.map(o => {
      if (o.id !== entry.targetId) return o;
      const st = o.stages[entry.stageKey] || { done: 0, remain: 0 };
      const newDone = Math.max(0, (st.done || 0) + delta);
      let updated = { ...o, stages: { ...o.stages, [entry.stageKey]: { ...st, done: newDone } } };
      if (entry.stageKey === "keo_trung" && newWireType === "Dây ủ mềm") updated.wireFinish = "mềm";
      updated = normalizeOrderStages(updated);
      return updated;
    });
    await data.persistOrders(nextOrders);
    const nextLog = freshLog.map(e => e.id === entryId
      ? { ...e, qty: newQty, materialCode: newMaterialCode, wireType: newWireType, date: newDate,
          detail: e.detail.replace(/^Nhập [\d.,]+/, `Nhập ${fmtNum(newQty)}`) + " (đã chỉnh sửa)" }
      : e);
    await Promise.all(data.auditLog.slice(0,10).map(e => db.collection(FS.audit).doc(e.id).set({...e,ts:e.ts||firebase.firestore.FieldValue.serverTimestamp()},{merge:true})));
    audit("production_entry_edit", `Chỉnh sửa lượt nhập: ${entry.customer} / ${entry.spec} — ${fmtNum(entry.qty)} → ${fmtNum(newQty)}`, entry.targetId);
  }

  async function handleDeleteProductionEntry(entryId) {
    const freshLog = data.auditLog;
    const entry = freshLog.find(e => e.id === entryId);
    if (!entry) return;
    // onSnapshot keeps data.orders fresh
    const nextOrders = baseOrders.map(o => {
      if (o.id !== entry.targetId) return o;
      const st = o.stages[entry.stageKey] || { done: 0, remain: 0 };
      const newDone = Math.max(0, (st.done || 0) - (entry.qty || 0));
      let updated = { ...o, stages: { ...o.stages, [entry.stageKey]: { ...st, done: newDone } } };
      updated = normalizeOrderStages(updated);
      return updated;
    });
    await data.persistOrders(nextOrders);
    await data.persistAuditLog(freshLog.filter(e => e.id !== entryId));
    audit("production_entry_delete", `Xóa lượt nhập: ${entry.customer} / ${entry.spec} — ${fmtNum(entry.qty)} kg tại "${STAGE_MAP[entry.stageKey]?.label}"`, entry.targetId);
  }


  async function handleKeoTrungEntry({ stageKey, qty, note, wireType, materialCode, diameter, customer, date }) {
    const entryDate = date || new Date().toISOString().slice(0, 10);
    let linkedOrderId = null;

    // Nếu là Dây ủ mềm + có tên khách hàng → tự động tìm đơn hàng khớp
    // (cùng khách hàng, cùng mã liệu, đã đánh dấu wireFinish="mềm") và cập nhật
    // stages.keo_trung.done + finishedDone để tiến độ đơn hàng phản ánh đúng.
    // Có tên khách hàng → sản lượng này là THÀNH PHẨM cho đơn hàng đó
    // (bất kể Dây cứng hay Dây ủ mềm) → đánh dấu wireFinish="mềm" để BOM chỉ còn Kéo trung
    // Không có tên khách hàng → Phôi cho công đoạn sau, không thay đổi BOM
    if (customer) {
      // onSnapshot keeps data.orders fresh
      const customerNorm = (customer || "").trim().toUpperCase();
      const matchOrders = baseOrders.filter(o =>
        (o.customer || "").trim().toUpperCase() === customerNorm &&
        (o.materialCode || "") === materialCode &&
        (o.stages?.keo_trung?.done || 0) < (o.quantity || 0)
      );
      if (matchOrders.length > 0) {
        const sorted = [...matchOrders].sort((a, b) => new Date(a.orderDate || 0) - new Date(b.orderDate || 0));
        let remaining = qty;
        const updatedOrders = baseOrders.map(o => {
          const match = sorted.find(m => m.id === o.id);
          if (!match || remaining <= 0) return o;
          const st = o.stages?.keo_trung || { done: 0, remain: 0 };
          const addQty = Math.min(remaining, Math.max(0, (o.quantity || 0) - (st.done || 0)));
          if (addQty <= 0) return o;
          remaining -= addQty;
          const newDone = (st.done || 0) + addQty;
          // Chỉ đặt wireFinish="mềm" nếu chưa được người dùng đặt tường minh.
          // Nếu user đã đặt "cứng" → tôn trọng lựa chọn đó, KHÔNG ghi đè.
          const newWireFinish = o.wireFinish === "cứng" ? "cứng" : "mềm";
          let updated = {
            ...o,
            wireFinish: newWireFinish,
            stages: { ...o.stages, keo_trung: { done: newDone, remain: Math.max(0, (o.quantity || 0) - newDone) } }
          };
          updated = normalizeOrderStages(updated);
          if (!linkedOrderId) linkedOrderId = o.id;
          return updated;
        });
        await data.persistOrders(updatedOrders);
      }
    }

    const newEntry = {
      id: uid("AL"),
      ts: new Date().toISOString(),
      type: "production_entry",
      stageKey,
      qty,
      materialCode,
      wireType,
      diameter: diameter || "",
      note,
      date: entryDate,
      detail: `Kéo trung: ${fmtNum(qty)} kg — Mã ${materialCode} · ĐK ${diameter || '?'}mm · ${wireType}${customer ? ' · ' + customer : ''} · ${note}`,
      user: currentUser.fullName,
      targetId: linkedOrderId,
      spec: null,
      customer: customer || null,
    };
    const freshLog = data.auditLog;
    const nextLog = [newEntry, ...freshLog].slice(0, 500);
    await Promise.all(data.auditLog.slice(0,10).map(e => db.collection(FS.audit).doc(e.id).set({...e,ts:e.ts||firebase.firestore.FieldValue.serverTimestamp()},{merge:true})));
  }

  async function handleAddOrder(newOrder) {
    // onSnapshot keeps data.orders fresh
    await data.persistOrders([newOrder, ...baseOrders]);
    audit("order_add", `Thêm đơn hàng mới: ${newOrder.customer} / ${newOrder.spec} (SL: ${fmtNum(newOrder.quantity)})`, newOrder.id);
  }
  async function handleUpdateOrder(updated) {
    const normalized = normalizeOrderStages(updated);
    // data.orders luôn cập nhật qua onSnapshot()
    // để tránh đọc dữ liệu cũ từ storage đè lên wireFinish vừa được người dùng sửa
    const nextOrders = data.orders.map(o => o.id === normalized.id ? normalized : o);
    await data.persistOrders(nextOrders);
    audit("order_update", `Chỉnh sửa đơn hàng: ${normalized.customer} / ${normalized.spec}`, normalized.id);
  }
  async function handleDeleteOrder(id) {
    // onSnapshot keeps data.orders fresh
    const o = baseOrders.find(x => x.id === id);
    await data.persistOrders(baseOrders.filter(x => x.id !== id));
    audit("order_delete", `Xóa đơn hàng: ${o?.customer || id} / ${o?.spec || ""}`, id);
  }

  function handleUpdateMachine(id, status, note) {
    db.collection(FS.machines).doc(id).update({ status, note, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: currentUser.fullName }).catch(()=>{});
    audit("machine_update", `Cập nhật máy ${id}: trạng thái → ${MACHINE_STATUS[status].label}`, id);
  }

  async function handleAddScrap(rec) {
    // onSnapshot keeps data.scrap fresh
    await db.collection(FS.scrap).doc(rec.id).set({ ...rec, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    audit("scrap_add", `Ghi nhận phế liệu ${fmtNum(rec.qty)}${rec.unit} tại công đoạn "${STAGE_MAP[rec.stage]?.label}"${rec.customer ? " — " + rec.customer : ""}`, rec.id);
  }
  async function handleDeleteScrap(id) {
    // onSnapshot keeps data.scrap fresh
    await db.collection(FS.scrap).doc(id).delete();
    audit("scrap_add", `Xóa ghi nhận phế liệu ${id}`, id);
  }

  async function handleAddStaff(s) {
    // onSnapshot keeps data.staff fresh
    await db.collection(FS.staff).doc(s.id).set({ ...s, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    audit("staff_update", `Thêm nhân viên: ${s.name} (${s.team})`, s.id);
  }
  async function handleUpdateStaff(s) {
    // onSnapshot keeps data.staff fresh
    await db.collection(FS.staff).doc(s.id).update({ ...s, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    audit("staff_update", `Cập nhật nhân viên: ${s.name}`, s.id);
  }
  async function handleDeleteStaff(id) {
    // onSnapshot keeps data.staff fresh
    const s = data.staff.find(x => x.id === id);
    await db.collection(FS.staff).doc(id).delete();
    audit("staff_update", `Xóa nhân viên: ${s?.name || id}`, id);
  }

  async function handleImportStaff(rows, mode) {
    const batch = db.batch();
    if (mode === "replace") {
      data.staff.forEach(s => batch.delete(db.collection(FS.staff).doc(s.id)));
      rows.forEach(r => { const id = uid("NV"); batch.set(db.collection(FS.staff).doc(id), { ...r, id, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); });
      await batch.commit();
      audit("staff_update", `Tải lên Excel: thay thế ${rows.length} nhân viên`);
    } else {
      let added = 0, updated = 0;
      rows.forEach(r => {
        const ex = data.staff.find(s => s.code === r.code);
        if (ex) { batch.update(db.collection(FS.staff).doc(ex.id), { ...r, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); updated++; }
        else { const id = uid("NV"); batch.set(db.collection(FS.staff).doc(id), { ...r, id }); added++; }
      });
      await batch.commit();
      audit("staff_update", `Tải lên Excel: ${added} mới, ${updated} cập nhật`);
    }
  }

  async function handleAttendanceUpdate(dayKey, dayData) {
    if (!dayData || Object.keys(dayData).length === 0) {
      await db.collection(FS.attendance).doc(dayKey).delete();
    } else {
      await db.collection(FS.attendance).doc(dayKey).set(dayData);
    }
  }

  function handleAddUser(payload) {
    if (data.users.some(u => u.username === payload.username)) { showAlert("Tên đăng nhập đã tồn tại."); return; }
    db.collection(FS.users).add({ ...payload, uid: uid("USR"), createdAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
    audit("user_update", `Tạo tài khoản mới: ${payload.username} (${payload.role})`, payload.username);
  }
  function handleUpdateUser(payload) {
    { const ex = data.users.find(u => u.username === payload.username); if (ex) db.collection(FS.users).doc(ex.uid||ex.id).update({ ...payload, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{}); }
    audit("user_update", `Cập nhật tài khoản: ${payload.username}`, payload.username);
  }
  function handleDeleteUser(username) {
    { const ex = data.users.find(u => u.username === username); if (ex) db.collection(FS.users).doc(ex.uid||ex.id).delete().catch(()=>{}); }
    audit("user_update", `Xóa tài khoản: ${username}`, username);
  }

  async function handleResetSeedData() {
    /* no-op: no seed data */
    { const batch = db.batch(); genMachineSeed().forEach(m => batch.set(db.collection(FS.machines).doc(m.id), m)); await batch.commit(); }
    /* no-op: no seed data */
    await /* no-op: no seed data */
    audit("user_update", "Khôi phục toàn bộ dữ liệu mẫu gốc (đơn hàng, máy móc, nhân sự, phế liệu)");
  }

  const pageTitles = {
    dashboard: "Tổng quan sản xuất", orders: "Đơn hàng & BOM", machines: "Máy móc thiết bị",
    qc: "Chất lượng & phế liệu", staff: "Nhân sự", reports: "Báo cáo & biểu đồ", admin: "Quản trị hệ thống",
  };

  return (
    <div className="mes-root">
      <GlobalStyle />
      <div style={{ display: "flex" }}>
        <Sidebar active={activeTab} onChange={setActiveTab} role={currentUser.role} collapsed={collapsed} onToggleCollapse={() => setCollapsed(c => !c)} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <TopBar currentUser={currentUser} onLogout={() => setCurrentUser(null)} pageTitle={pageTitles[activeTab]} onRefresh={data.refreshAll} />
          <div style={{ padding: 22, maxWidth: 1320, margin: "0 auto" }}>
            {activeTab === "dashboard" && (
              <DashboardPage currentUser={currentUser} orders={data.orders} machines={data.machines} staff={data.staff} scrap={data.scrap} auditLog={data.auditLog} onQuickEntry={handleQuickEntry} onKeoTrungEntry={handleKeoTrungEntry} onEditKeoTrung={handleEditProductionEntry} onDeleteKeoTrung={handleDeleteProductionEntry} />
            )}
            {activeTab === "orders" && (
              <OrdersPage orders={data.orders} auditLog={data.auditLog} isAdmin={isAdmin} currentUser={currentUser} onAdd={handleAddOrder} onUpdate={handleUpdateOrder} onDelete={handleDeleteOrder} onRestoreSeed={handleResetSeedData} />
            )}
            {activeTab === "machines" && (
              <MachinesPage machines={data.machines} isAdmin={isAdmin} onUpdateMachine={handleUpdateMachine} onRestoreSeed={handleResetSeedData} />
            )}
            {activeTab === "qc" && (
              <QCPage scrap={data.scrap} isAdmin={isAdmin} currentUser={currentUser} onAdd={handleAddScrap} onDelete={handleDeleteScrap} orders={data.orders} />
            )}
            {activeTab === "staff" && (
              <StaffPage staff={data.staff} isAdmin={isAdmin} onAdd={handleAddStaff} onUpdate={handleUpdateStaff} onDelete={handleDeleteStaff} onRestoreSeed={handleResetSeedData} onImport={handleImportStaff} attendance={data.attendance} onAttendanceUpdate={handleAttendanceUpdate} />
            )}
            {activeTab === "reports" && (
              <ReportsPage orders={data.orders} machines={data.machines} scrap={data.scrap} timeseries={SEED_TIMESERIES} auditLog={data.auditLog} onEditProductionEntry={handleEditProductionEntry} onDeleteProductionEntry={handleDeleteProductionEntry} />
            )}
            {activeTab === "admin" && isAdmin && (
              <AdminPage users={data.users} auditLog={data.auditLog} currentUser={currentUser} onAddUser={handleAddUser} onUpdateUser={handleUpdateUser} onDeleteUser={handleDeleteUser} onResetSeedData={handleResetSeedData} />
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

export default function App() {
  return (
    <DialogProvider>
      <AppInner />
    </DialogProvider>
  );
}

  </script>
