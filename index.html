function todayMinus(days) {
  const d = new Date();
  d.setDate(d.getDate() - days);
  return d.toISOString().slice(0, 10);
}

function genMachineSeed() {
  const list = [];
  MACHINE_TYPES.forEach(type => {
    for (let i = 1; i <= type.count; i++) {
      const idx = list.length;
      let status = "running";
      if (idx % 23 === 11) status = "maintenance";
      else if (idx % 17 === 5) status = "idle";
      else if (idx % 41 === 7) status = "broken";
      list.push({
        id: `${type.prefix}-${String(i).padStart(2, "0")}`,
        typeKey: type.key,
        typeLabel: type.label,
        stage: type.stage,
        status,
        note: status === "broken" ? "Chờ thay linh kiện" : status === "maintenance" ? "Bảo trì định kỳ theo lịch" : "",
        updatedAt: new Date().toISOString(),
        updatedBy: "system",
      });
    }
  });
  return list;
}

/* ===================== UTILITIES ===================== */
// Lưu ý: đây là hệ thống demo nội bộ — tài khoản/mật khẩu lưu dạng văn bản thường
// trong bộ nhớ dùng chung, KHÔNG dùng cơ chế mã hoá. Không phù hợp triển khai thật
// cho dữ liệu nhạy cảm mà chưa có lớp bảo mật/server riêng.

function fmtNum(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  return Number(n).toLocaleString("vi-VN", { maximumFractionDigits: 1 });
}

function fmtDate(iso) {
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("vi-VN");
  } catch { return iso; }
}

function fmtDateTime(iso) {
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    return d.toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit", year: "numeric" });
  } catch { return iso; }
}

function uid(prefix) {
  return prefix + "-" + Math.random().toString(36).slice(2, 9);
}

function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

// "Còn lại" của mỗi công đoạn luôn = Số lượng đặt hàng - Đã làm (đúng công thức báo cáo gốc).
// Không lưu độc lập nữa để tránh lệch số khi chỉ sửa "Đã làm".
// Gom nhóm theo Ngày / Tuần (bắt đầu Thứ 2) / Tháng — dùng cho biểu đồ sản lượng theo nguyên liệu
function getBucketKey(dateStr, granularity) {
  const d = new Date(dateStr + "T00:00:00");
  if (Number.isNaN(d.getTime())) return dateStr;
  if (granularity === "day") return dateStr;
  if (granularity === "month") return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  return monday.toISOString().slice(0, 10);
}
function getBucketLabel(key, granularity) {
  if (granularity === "month") {
    const [y, m] = key.split("-");
    return `Tháng ${m}/${y}`;
  }
  if (granularity === "week") return `Tuần ${fmtDate(key)}`;
  return fmtDate(key);
}

function computeStageRemain(quantity, done) {
  if (typeof quantity !== "number") return null;
  return Math.round((quantity - (done || 0)) * 100) / 100;
}

// Đảm bảo "remain" lưu trong dữ liệu luôn khớp với Số lượng đặt - Đã làm,
// để mọi nơi đọc trực tiếp order.stages[key].remain (Tổng quan, biểu đồ...)
// đều nhận giá trị đúng, không chỉ riêng màn hình chi tiết đơn hàng.
function normalizeOrderStages(order) {
  const stages = {};
  STAGES.forEach(s => {
    const done = order.stages?.[s.key]?.done || 0;
    const computed = computeStageRemain(order.quantity, done);
    stages[s.key] = { done, remain: computed !== null ? computed : (order.stages?.[s.key]?.remain || 0) };
  });
  const result = { ...order, stages };
  // KHÔNG tự đặt wireFinish — người dùng hoặc handleKeoTrungEntry đặt tường minh
  const applicable = getApplicableStages(result);
  const lastStageKey = applicable[applicable.length - 1];
  if (lastStageKey) {
    const lastDone = stages[lastStageKey]?.done || 0;
    result.finishedDone = lastDone;
    result.finishedShort = typeof order.quantity === "number" ? Math.round((order.quantity - lastDone) * 100) / 100 : (order.finishedShort || 0);
  }
  return result;
}

// Quy trình công đoạn phụ thuộc loại dây, suy ra từ "quy cách" (spec):
//  - Dây ủ mềm (wireFinish="mềm")       -> [Kéo trung] (thành phẩm ngay tại đây)
//  - Dây đồng BC 1 sợi (vd "0.254BC")  -> Kéo tinh, Ủ nhiệt
//  - Dây đồng TC 1 sợi (vd "0.16TC")   -> Kéo tinh, Mạ thiếc
//  - Dây đồng Bện (vd "7/0.150BC")     -> Kéo tinh, Ủ nhiệt/Mạ thiếc, Bện
// Kéo trung là công đoạn NỘI BỘ cung cấp nguyên vật liệu — KHÔNG hiện trong
// BOM của đơn hàng thông thường (trừ đơn đặt Dây ủ mềm trực tiếp từ Kéo trung).
function getApplicableStages(order) {
  // Dây ủ mềm: chỉ 1 công đoạn Kéo trung, thành phẩm ngay tại đây.
  // Điều kiện: (1) đã đánh dấu wireFinish="mềm" thủ công, HOẶC
  //            (2) quy cách không có hậu tố BC/TC và không phải dây bện
  //                (tức là không xác định được loại — mặc định coi là dây ủ mềm)
  const specStr = order.spec !== undefined && order.spec !== null ? String(order.spec).trim().toUpperCase() : "";
  const isStranded = specStr.includes("/");
  const isBC = /\dBC\b/.test(specStr) || /BC$/.test(specStr);
  const isTC = /\dTC\b/.test(specStr) || /TC$/.test(specStr);
  const hasKnownType = isBC || isTC || isStranded;
  // Nhận diện dây ủ mềm:
  // 1) Đã đánh dấu wireFinish="mềm" thủ công, HOẶC
  // 2) Quy cách không có BC/TC/bện VÀ KHÔNG có dữ liệu các công đoạn downstream
  //    (Kéo tinh, Ủ nhiệt, Mạ thiếc, Bện) — nếu đã có downstream thì là đơn thường.
  const hasDownstreamData = ["keo_tinh", "keo_sieu_tinh", "u_nhiet", "ma_thiec", "ben"]
    .some(k => (order.stages?.[k]?.done || 0) > 0);
  // Spec không có BC/TC và không có downstream data → luôn là dây ủ mềm,
  // bỏ qua wireFinish đang lưu (kể cả "cứng" bị gán nhầm từ form Kéo trung).
  // wireFinish="cứng" chỉ có hiệu lực khi spec đã có BC/TC rõ ràng.
  const isSoftWire = order.wireFinish === "mềm" ||
    (!hasKnownType && specStr !== "" && !hasDownstreamData);

  if (isSoftWire) return ["keo_trung"];

  // Đơn thông thường (wireFinish="cứng" hoặc có BC/TC/bện): bắt đầu từ Kéo tinh
  const keys = ["keo_tinh"];
  keys.push(isTC ? "ma_thiec" : "u_nhiet");
  if (isStranded) keys.push("ben");
  // Giữ lại công đoạn nào đã có số liệu thực tế
  STAGES.forEach(s => {
    const done = order.stages?.[s.key]?.done || 0;
    if (done > 0 && !keys.includes(s.key) && s.key !== "keo_trung") keys.push(s.key);
  });
  return STAGES.filter(s => keys.includes(s.key)).map(s => s.key);
}

// Tiến độ đơn hàng: lấy giá trị "đã hoàn thành" lớn nhất giữa các công đoạn và thành phẩm
function orderProgress(order) {
  const qty = typeof order.quantity === "number" ? order.quantity : null;
  // % Tiến độ = Thành phẩm / Số lượng đặt hàng
  // "Thành phẩm" (finishedDone) luôn được đồng bộ bằng sản lượng của công đoạn CUỐI CÙNG
  // trong quy trình của đơn (normalizeOrderStages): Kéo trung cho dây ủ mềm, Bện cho dây
  // bện, Ủ nhiệt/Mạ thiếc cho dây 1 sợi — chính xác hơn lấy max giữa các công đoạn.
  const completedQty = order.finishedDone || 0;
  const applicable = getApplicableStages(order);
  const lastStageKey = applicable[applicable.length - 1];
  const lastStageDone = order.stages?.[lastStageKey]?.done || 0;
  const anyStageStarted = STAGES.some(s => (order.stages?.[s.key]?.done || 0) > 0);
  const furthestStageIdx = applicable.length > 0 ? STAGES.findIndex(s => s.key === lastStageKey) : -1;
  const pct = qty && qty > 0 ? clamp((completedQty / qty) * 100, 0, 999) : null;
  const remainingQty = qty !== null ? Math.round((qty - completedQty) * 100) / 100 : null;
  let statusLabel = "Đang sản xuất";
  let statusColor = COLORS.amber;
  if (qty && completedQty >= qty && qty > 0) { statusLabel = "Hoàn thành"; statusColor = COLORS.green; }
  else if (!anyStageStarted && completedQty === 0) { statusLabel = "Chưa bắt đầu"; statusColor = COLORS.textFaint; }
  return { completedQty, pct, remainingQty, statusLabel, statusColor, furthestStageIdx, lastStageKey, lastStageDone };
}

// ════════════════════════════════════════════════════════════════════════
// FIRESTORE REAL-TIME STORAGE LAYER
// Mỗi collection = nhiều Firestore documents. onSnapshot = real-time sync.
// ════════════════════════════════════════════════════════════════════════
const FS = {
  orders:"orders", staff:"staff", machines:"machines",
  scrap:"scrap", audit:"auditLog", attendance:"attendance", users:"users",
};

// Wrappers để giữ tương thích API với code hiện tại
async function storeGet(key) {
  try {
    const snaps = await db.collection(key).get();
    if (snaps.empty) return null;
    return snaps.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch { return null; }
}
async function storeSet() { /* no-op: dùng Firestore trực tiếp */ }

/* ===================== APP DATA HOOK ===================== */
function useAppData() {
  const [ready, setReady] = React.useState(false);
  const [users, setUsers] = React.useState([]);
  const [orders, setOrders] = React.useState([]);
  const [machines, setMachines] = React.useState([]);
  const [staff, setStaff] = React.useState([]);
  const [scrap, setScrap] = React.useState([]);
  const [auditLog, setAuditLog] = React.useState([]);
  const [attendance, setAttendance] = React.useState({});
  const [storageError] = React.useState(false);

  React.useEffect(() => {
    let n = 0; const total = 7;
    const done = () => { n++; if (n >= total) setReady(true); };

    const unsubs = [
      db.collection(FS.orders).orderBy("createdAt","desc")
        .onSnapshot(s => { setOrders(s.docs.map(d=>({id:d.id,...d.data()}))); done(); }, ()=>done()),
      db.collection(FS.staff).orderBy("team")
        .onSnapshot(s => { setStaff(s.docs.map(d=>({id:d.id,...d.data()}))); done(); }, ()=>done()),
      db.collection(FS.machines)
        .onSnapshot(s => { setMachines(s.docs.map(d=>({id:d.id,...d.data()}))); done(); }, ()=>done()),
      db.collection(FS.scrap).orderBy("date","desc")
        .onSnapshot(s => { setScrap(s.docs.map(d=>({id:d.id,...d.data()}))); done(); }, ()=>done()),
      db.collection(FS.audit).orderBy("ts","desc").limit(500)
        .onSnapshot(s => { setAuditLog(s.docs.map(d=>({id:d.id,...d.data()}))); done(); }, ()=>done()),
      db.collection(FS.users)
        .onSnapshot(s => { setUsers(s.docs.map(d=>({id:d.id,uid:d.id,...d.data()}))); done(); }, ()=>done()),
      db.collection(FS.attendance)
        .onSnapshot(s => {
          const a={}; s.docs.forEach(d=>{a[d.id]=d.data();}); setAttendance(a); done();
        }, ()=>done()),
    ];
    return () => unsubs.forEach(u=>u());
  }, []);

  // persist* = batch-write arrays → Firestore (giữ API compat với toàn bộ handlers)
  const _batch = async (col, arr) => {
    const batch = db.batch();
    arr.forEach(item => {
      const ref = db.collection(col).doc(item.id);
      batch.set(ref, { ...item, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    });
    return batch.commit();
  };
  const persistOrders     = React.useCallback(arr => _batch(FS.orders, arr), []);
  const persistStaff      = React.useCallback(arr => _batch(FS.staff, arr), []);
  const persistMachines   = React.useCallback(arr => _batch(FS.machines, arr), []);
  const persistScrap      = React.useCallback(arr => _batch(FS.scrap, arr), []);
  const persistUsers      = React.useCallback(arr => _batch(FS.users, arr.map(u=>({...u,id:u.uid||u.username||u.id}))), []);
  const persistAuditLog   = React.useCallback(async arr => {
    const batch = db.batch();
    arr.slice(0,20).forEach(e => {
      const ref = db.collection(FS.audit).doc(e.id);
      batch.set(ref, { ...e, ts: e.ts || firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    });
    return batch.commit();
  }, []);
  const persistAttendance = React.useCallback(async obj => {
    const batch = db.batch();
    Object.entries(obj).forEach(([date, data]) => {
      const ref = db.collection(FS.attendance).doc(date);
      if (data && Object.keys(data).length > 0) batch.set(ref, data);
      else batch.delete(ref);
    });
    return batch.commit();
  }, []);

  const pushAudit = React.useCallback(async entry => {
    await db.collection(FS.audit).add({
      ...entry, ts: firebase.firestore.FieldValue.serverTimestamp()
    });
  }, []);
  const refreshAll = React.useCallback(() => {}, []); // no-op: onSnapshot handles it

  return {
    ready, storageError,
    users, orders, machines, staff, scrap, auditLog, attendance,
    persistUsers, persistOrders, persistMachines, persistStaff,
    persistScrap, persistAuditLog, persistAttendance,
    pushAudit, refreshAll,
  };
}

    try {
      const emailAddr = username.trim().includes("@")
        ? username.trim()
        : username.trim().toLowerCase() + "@xuongdong.com";
      const cred = await auth.signInWithEmailAndPassword(emailAddr, password);
      const snap = await db.collection("users").doc(cred.user.uid).get();
      const profile = snap.exists()
        ? { uid: cred.user.uid, username: snap.data().username || username, ...snap.data() }
        : { uid: cred.user.uid, username, role: "employee", fullName: username, team: "" };

          );
        })}
      </div>
    </div>
  );
}

function QuickEntryForm({ currentUser, orders, onSubmit }) {
  // Kéo trung có trang riêng — không hiện trong form này
  const allStages = TEAM_STAGE_OPTIONS[currentUser.team] || STAGES.map(s => s.key);
  const teamStages = allStages.filter(k => k !== "keo_trung");
  const [stageKey, setStageKey] = useState(teamStages[0] || STAGES[1].key);
  const [orderId, setOrderId] = useState("");
  const [qty, setQty] = useState("");
  const [note, setNote] = useState("Ca ngày");
  const [msg, setMsg] = useState("");

  const eligibleOrders = useMemo(() => orders.filter(o => getApplicableStages(o).includes(stageKey)), [orders, stageKey]);

  useEffect(() => { if (!eligibleOrders.find(o => o.id === orderId)) setOrderId(eligibleOrders[0]?.id || ""); }, [stageKey]); // eslint-disable-line

  function handleSubmit() {
    const n = parseFloat(qty);
    if (!orderId) { setMsg("Vui lòng chọn đơn hàng."); return; }
    if (!n || n <= 0) { setMsg("Số lượng phải lớn hơn 0."); return; }
    onSubmit({ orderId, stageKey, qty: n, note });
    setQty(""); setMsg("Đã ghi nhận sản lượng thành công.");
    setTimeout(() => setMsg(""), 3000);
  }

  const order = orders.find(o => o.id === orderId);

  return (
    <div className="mes-card" style={{ padding: 18 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
        <ClipboardCheck size={16} color={COLORS.copper} />
        <div>
          <div className="mes-mono" style={{ fontSize: 10, color: COLORS.blue, letterSpacing: ".08em", textTransform: "uppercase", marginBottom: 2 }}>Tổng quan · Sản xuất</div>
          <div className="mes-display" style={{ fontSize: 19, fontWeight: 700, letterSpacing: "-0.01em" }}>Nhập sản lượng đã xuất xong</div>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Field label="Công đoạn">
          <select className="mes-input" value={stageKey} onChange={e => setStageKey(e.target.value)}>
            {(teamStages.length ? teamStages : STAGES.map(s => s.key)).map(k => <option key={k} value={k}>{STAGE_MAP[k]?.label}</option>)}
          </select>
        </Field>
        <Field label="Số lượng vừa hoàn thành (kg/m)">
          <input className="mes-input" type="number" min="0" step="0.1" value={qty} onChange={e => setQty(e.target.value)} placeholder="ví dụ: 250" />
        </Field>
      </div>
      <Field label="Đơn hàng / khách hàng">
        <select className="mes-input" value={orderId} onChange={e => setOrderId(e.target.value)}>
          {eligibleOrders.length === 0 && <option value="">Không có đơn hàng phù hợp</option>}
          {eligibleOrders.map(o => <option key={o.id} value={o.id}>{o.customer} · {o.spec} (còn {fmtNum(computeStageRemain(o.quantity, o.stages[stageKey]?.done) ?? o.stages[stageKey]?.remain)})</option>)}
        </select>
      </Field>
      {order && (
        <div style={{ background: COLORS.bgInset, borderRadius: 8, padding: "8px 10px", fontSize: 12, color: COLORS.textDim, marginBottom: 12, display: "flex", justifyContent: "space-between" }}>
          <span>Đã làm: <b className="mes-mono" style={{ color: COLORS.text }}>{fmtNum(order.stages[stageKey]?.done)}</b></span>
          <span>Còn lại: <b className="mes-mono" style={{ color: COLORS.amber }}>{fmtNum(computeStageRemain(order.quantity, order.stages[stageKey]?.done) ?? order.stages[stageKey]?.remain)}</b></span>
          <span>Đặt hàng: <b className="mes-mono" style={{ color: COLORS.text }}>{fmtNum(order.quantity)}</b></span>
        </div>
      )}
      <Field label="Ca sản xuất">
        <select className="mes-input" value={note} onChange={e => setNote(e.target.value)}>
          <option value="Ca ngày">Ca ngày</option>
          <option value="Ca đêm">Ca đêm</option>
        </select>
      </Field>
      {msg && <div style={{ fontSize: 12.5, color: msg.includes("thành công") ? COLORS.green : COLORS.red, marginBottom: 10 }}>{msg}</div>}
      <Button variant="primary" type="button" onClick={handleSubmit} style={{ width: "100%", justifyContent: "center" }}><Save size={14} /> Ghi nhận sản lượng</Button>
    </div>
  );
}

function DashboardPage({ currentUser, orders, machines, staff, scrap, auditLog, onQuickEntry, onKeoTrungEntry, onEditKeoTrung, onDeleteKeoTrung }) {
  const stageTotals = useMemo(() => {
    const t = {};
    STAGES.forEach(s => { t[s.key] = orders.reduce((acc, o) => acc + (o.stages?.[s.key]?.done || 0), 0); });
    return t;
  }, [orders]);

  const machineStats = useMemo(() => {
    const t = { running: 0, idle: 0, maintenance: 0, broken: 0 };
    machines.forEach(m => { t[m.status] = (t[m.status] || 0) + 1; });
    return t;
  }, [machines]);

  const openOrders = orders.filter(o => orderProgress(o).statusLabel !== "Hoàn thành").length;
  const last7Scrap = scrap.filter(s => {
    const d = new Date(s.date); const now = new Date();
    return (now - d) / (1000 * 3600 * 24) <= 7;
  }).reduce((a, s) => a + (s.qty || 0), 0);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
        <StatCard icon={ClipboardList} label="Đơn hàng đang xử lý" value={openOrders} sub={`${orders.length} đơn trong hệ thống`} accent={COLORS.copper} />
        <StatCard icon={Cog} label="Máy đang chạy" value={`${machineStats.running}/${machines.length}`} sub={`${machineStats.maintenance} bảo trì · ${machineStats.broken} hỏng`} accent={COLORS.green} />
        <StatCard icon={Users} label="Nhân sự" value={staff.length} sub={`${TEAMS.filter(t => staff.some(s => s.team === t)).length} tổ sản xuất`} accent={COLORS.blue} />
        <StatCard icon={Recycle} label="Phế liệu 7 ngày qua" value={`${fmtNum(last7Scrap)} kg`} sub={`${scrap.length} lượt ghi nhận`} accent={COLORS.red} />
      </div>

      <ProductionPipeline stageTotals={stageTotals} />

      <div style={{ display: "grid", gridTemplateColumns: currentUser.role === "employee" ? "minmax(0,1fr) minmax(0,1fr)" : "minmax(0,1fr) minmax(0,1fr)", gap: 18 }}>
        <QuickEntryForm currentUser={currentUser} orders={orders} onSubmit={onQuickEntry} />
        <ActivityFeed auditLog={auditLog} />
      </div>

      {(currentUser.role === "admin" || currentUser.team === "KÉO") && (
      <div style={{ borderTop: `2px solid ${COLORS.border}`, paddingTop: 20 }}>
        <KeoTrungPage
          orders={orders}
          auditLog={auditLog}
          currentUser={currentUser}
          onSubmit={onKeoTrungEntry}
          onEditEntry={onEditKeoTrung}
          onDeleteEntry={onDeleteKeoTrung}
        />
      </div>
      )}
    </div>
  );
}

/* ===================== ORDERS / BOM PAGE ===================== */
function StageMiniBars({ order }) {
  const applicable = getApplicableStages(order);
  return (
    <div style={{ display: "flex", gap: 3 }}>
      {STAGES.filter(s => applicable.includes(s.key)).map(s => {
        const st = order.stages?.[s.key];
        const done = st?.done || 0;
        const qty = order.quantity || 0;
        const pct = qty > 0 ? clamp((done / qty) * 100, 0, 100) : (done > 0 ? 100 : 0);
        const active = done > 0;
        const remain = computeStageRemain(order.quantity, done) ?? st?.remain;
        return (
          <div key={s.key} title={`${s.label}: đã ${fmtNum(done)} / còn ${fmtNum(remain)}`} style={{ width: 16, height: 22, background: COLORS.bgInset, borderRadius: 3, overflow: "hidden", display: "flex", flexDirection: "column-reverse", border: `1px solid ${COLORS.border}` }}>
            <div style={{ width: "100%", height: `${pct}%`, background: active ? COLORS.copper : "transparent" }} />
          </div>
        );
      })}
    </div>
  );
}

function emptyOrderForm() {
  const stages = {};
  STAGES.forEach(s => stages[s.key] = { done: 0, remain: 0 });
  return { customer: "", orderDate: new Date().toISOString().slice(0, 10), spec: "", materialCode: "", quantity: "", inventory: 0, stages, finishedDone: 0, finishedShort: 0 };
}

function OrderForm({ initial, onChange }) {
  const [form, setForm] = useState(initial);
  const [showAllStages, setShowAllStages] = useState(false);
  useEffect(() => { onChange(form); }, [form]); // eslint-disable-line
  const applicableStages = useMemo(() => getApplicableStages(form), [form.spec, form.stages]);

  function setStage(key, field, val) {
    setForm(f => ({ ...f, stages: { ...f.stages, [key]: { ...f.stages[key], [field]: val === "" ? "" : parseFloat(val) || 0 } } }));
  }

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Field label="Khách hàng"><input className="mes-input" value={form.customer} onChange={e => setForm(f => ({ ...f, customer: e.target.value }))} placeholder="ví dụ: HÒA AN" /></Field>
        <Field label="Ngày xuống đơn"><input className="mes-input" type="date" value={form.orderDate || ""} onChange={e => setForm(f => ({ ...f, orderDate: e.target.value }))} /></Field>
        <Field label="Quy cách"><input className="mes-input" value={form.spec} onChange={e => setForm(f => ({ ...f, spec: e.target.value }))} placeholder="ví dụ: 0.254BC" /></Field>
        <Field label="Mã liệu"><input className="mes-input" value={form.materialCode} onChange={e => setForm(f => ({ ...f, materialCode: e.target.value }))} placeholder="A / B / C ..." /></Field>
        <Field label="Số lượng đặt hàng"><input className="mes-input" type="number" value={form.quantity} onChange={e => setForm(f => ({ ...f, quantity: e.target.value === "" ? "" : parseFloat(e.target.value) || 0 }))} /></Field>
        <Field label="Tồn kho"><input className="mes-input" type="number" value={form.inventory} onChange={e => setForm(f => ({ ...f, inventory: parseFloat(e.target.value) || 0 }))} /></Field>
      </div>
      <div style={{ marginBottom: 14, padding: "10px 12px", borderRadius: 8, background: form.wireFinish === "mềm" ? `${COLORS.amber}18` : "transparent", border: form.wireFinish === "mềm" ? `1px solid ${COLORS.amber}60` : `1px solid ${COLORS.border}` }}>
        <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
          <Button
            type="button"
            onClick={() => {
              const newWireFinish = form.wireFinish === "mềm" ? "cứng" : "mềm";
              const newForm = { ...form, wireFinish: newWireFinish };
              setForm(newForm);
              onChange(newForm); // Gọi ngay lập tức để OrderModal nhận được giá trị mới
            }}
            style={{ padding: "4px 14px", fontSize: 12.5, flexShrink: 0, borderColor: form.wireFinish === "mềm" ? COLORS.amber : COLORS.border, background: form.wireFinish === "mềm" ? `${COLORS.amber}22` : COLORS.bgPanel2, color: form.wireFinish === "mềm" ? COLORS.amber : COLORS.textDim }}
          >
            {form.wireFinish === "mềm" ? "✓ Dây ủ mềm" : form.wireFinish === "cứng" ? "✗ Dây cứng" : "Chọn loại dây"}
          </Button>
          <div style={{ fontSize: 12.5, color: COLORS.textDim, paddingTop: 4 }}>
            {form.wireFinish === "mềm" ? <b style={{ color: COLORS.amber }}>Thành phẩm ngay tại Kéo trung</b> : <b style={{ color: COLORS.blue }}>Dây cứng thông thường</b>}
            {form.wireFinish === "mềm" ? " — bỏ qua Kéo tinh, Ủ nhiệt..." : " — qua Kéo tinh → Ủ nhiệt..."}
            {form.wireFinish === "mềm"
              ? <span style={{ display: "block", fontSize: 11.5, color: COLORS.amber, marginTop: 2 }}>✓ Thành phẩm tại Kéo trung. Bấm nút để chuyển sang Dây cứng.</span>
              : form.wireFinish === "cứng"
              ? <span style={{ display: "block", fontSize: 11.5, color: COLORS.blue, marginTop: 2 }}>Dây cứng — qua Kéo tinh → Ủ nhiệt bình thường. Bấm nút để chuyển sang Dây ủ mềm.</span>
              : <span style={{ display: "block", fontSize: 11.5, color: COLORS.red, marginTop: 2 }}>⚠ Chưa chọn loại — bấm nút để chọn. Với quy cách này cần chọn rõ Dây ủ mềm hoặc Dây cứng.</span>
            }
          </div>
        </div>
      </div>
      <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.textDim, textTransform: "uppercase", letterSpacing: ".03em", margin: "16px 0 8px" }}>Tiến độ theo công đoạn (BOM)</div>
      <div style={{ fontSize: 11.5, color: COLORS.textFaint, marginBottom: 8 }}>
        "Còn lại" tự tính = Số lượng đặt hàng − Đã làm. Quy trình hiển thị tự xác định theo quy cách (BC/TC, 1 sợi/bện).
        {" "}<button type="button" onClick={() => setShowAllStages(v => !v)} style={{ background: "none", border: "none", color: COLORS.copperBright, cursor: "pointer", textDecoration: "underline", fontSize: 11.5, padding: 0 }}>
          {showAllStages ? "Chỉ hiện công đoạn phù hợp" : "Hiện tất cả công đoạn"}
        </button>
      </div>
      <div className="mes-scroll-x">
        <table className="mes-table" style={{ minWidth: 480 }}>
          <thead><tr><th>Công đoạn</th><th>Đã làm</th><th>Còn lại (tự tính)</th></tr></thead>
          <tbody>
            {(showAllStages ? STAGES : STAGES.filter(s => applicableStages.includes(s.key))).map(s => {
              const remain = computeStageRemain(form.quantity, form.stages[s.key]?.done);
              return (
                <tr key={s.key}>
                  <td style={{ fontWeight: 600 }}>{s.label}</td>
                  <td><input className="mes-input" type="number" value={form.stages[s.key]?.done ?? 0} onChange={e => setStage(s.key, "done", e.target.value)} /></td>
                  <td className="mes-mono" style={{ color: remain === null ? COLORS.textFaint : remain < 0 ? COLORS.violet : COLORS.amber }}>{remain === null ? "— (chưa rõ số lượng đặt)" : fmtNum(remain)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 14 }}>
        <Field label="Thành phẩm - đã hoàn thành (tự tính)" hint={`= "Đã làm" của công đoạn cuối cùng (${STAGE_MAP[applicableStages[applicableStages.length - 1]]?.label || "—"})`}>
          <div className="mes-input mes-mono" style={{ color: COLORS.green, fontWeight: 700, cursor: "default" }}>{fmtNum(form.stages[applicableStages[applicableStages.length - 1]]?.done ?? form.finishedDone)}</div>
        </Field>
        <Field label="Thành phẩm - còn thiếu (tự tính)">
          <div className="mes-input mes-mono" style={{ color: COLORS.amber, fontWeight: 700, cursor: "default" }}>{fmtNum(computeStageRemain(form.quantity, form.stages[applicableStages[applicableStages.length - 1]]?.done) ?? form.finishedShort)}</div>
        </Field>
      </div>
    </div>
  );
}

  return (

  const { askConfirm } = useDialog();
  const [editing, setEditing] = useState(mode === "add");
  const [form, setForm] = useState(mode === "add" ? emptyOrderForm() : { ...order });
  const [tab, setTab] = useState("info");
  const prog = mode !== "add" ? orderProgress(order) : null;

  function handleSave() {
    onSave(form, mode === "add");
    setEditing(false);
    onClose();
  }

  return (
    <Modal title={mode === "add" ? "Thêm đơn hàng / BOM mới" : `${order.customer} · ${order.spec}`} onClose={onClose} width={680}>
      {mode !== "add" && (
        <div style={{ display: "flex", gap: 8, marginBottom: 16, borderBottom: `1px solid ${COLORS.border}` }}>
          {[["info", "Chi tiết BOM"], ["history", "Lịch sử chỉnh sửa"]].map(([k, l]) => (
            <button key={k} onClick={() => setTab(k)} style={{
              background: "none", border: "none", cursor: "pointer", padding: "8px 4px", marginRight: 14,
              color: tab === k ? COLORS.copperBright : COLORS.textDim, fontWeight: 600, fontSize: 13,
              borderBottom: tab === k ? `2px solid ${COLORS.copper}` : "2px solid transparent",
            }}>{l}</button>
          ))}
        </div>
      )}
      {tab === "history" ? <OrderHistoryList auditLog={auditLog} orderId={order.id} /> : (
        editing ? (
          <>
            <OrderForm initial={form} onChange={setForm} />
            <div style={{ display: "flex", gap: 10, marginTop: 16, justifyContent: "flex-end" }}>
              {mode !== "add" && <Button onClick={() => { setEditing(false); setForm({ ...order }); }}>Hủy</Button>}
              <Button variant="primary" onClick={handleSave}><Save size={14} /> Lưu thay đổi</Button>
            </div>
          </>
        ) : (
          <>
            {prog && (
              <div style={{ display: "flex", gap: 16, marginBottom: 16, flexWrap: "wrap" }}>

                <div><div style={{ fontSize: 12.5, color: COLORS.textFaint }}>Số lượng đặt</div><div className="mes-mono" style={{ fontWeight: 700, fontSize: 17 }}>{fmtNum(order.quantity)}</div></div>
                <div><div style={{ fontSize: 12.5, color: COLORS.textFaint }}>Còn lại cần làm</div><div className="mes-mono" style={{ fontWeight: 700, fontSize: 17, color: prog.remainingQty === null ? COLORS.textFaint : prog.remainingQty <= 0 ? COLORS.green : COLORS.amber }}>{prog.remainingQty === null ? "—" : prog.remainingQty <= 0 ? "Đủ hàng" : fmtNum(prog.remainingQty)}</div></div>
                <div><div style={{ fontSize: 12.5, color: COLORS.textFaint }}>Ngày xuống đơn</div><div className="mes-mono" style={{ fontSize: 15 }}>{fmtDate(order.orderDate)}</div></div>
                <div><div style={{ fontSize: 12.5, color: COLORS.textFaint }}>Mã liệu</div><div className="mes-mono" style={{ fontSize: 15 }}>{order.materialCode || "—"}</div></div>
              </div>
            )}
            <div className="mes-scroll-x">
              <table className="mes-table">
                <thead><tr><th>Công đoạn</th><th>Đã làm</th><th>Còn lại</th><th style={{ width: 140 }}>Tiến độ</th></tr></thead>
                <tbody>
                  {STAGES.filter(s => getApplicableStages(order).includes(s.key)).map(s => {
                    const st = order.stages?.[s.key] || { done: 0, remain: 0 };
                    const remain = computeStageRemain(order.quantity, st.done) ?? st.remain;
                    const pct = order.quantity ? clamp((st.done / order.quantity) * 100, 0, 100) : 0;
                    return (
                      <tr key={s.key}>
                        <td style={{ fontWeight: 600 }}>{s.label}</td>
                        <td className="mes-mono">{fmtNum(st.done)}</td>
                        <td className="mes-mono" style={{ color: remain < 0 ? COLORS.violet : COLORS.textDim }}>{fmtNum(remain)}</td>
                        <td><ProgressBar pct={pct} /></td>
                      </tr>
                    );
                  })}
                  <tr>
                    <td style={{ fontWeight: 700 }}>Thành phẩm</td>
                    <td className="mes-mono">{fmtNum(order.finishedDone)}</td>
                    <td className="mes-mono">{fmtNum(order.finishedShort)}</td>
                    <td>—</td>
                  </tr>
                </tbody>
              </table>
            </div>
            {isAdmin && (
              <div style={{ display: "flex", gap: 10, marginTop: 16, justifyContent: "flex-end" }}>
                <Button variant="danger" onClick={async () => { if (await askConfirm("Xóa đơn hàng này? Hành động không thể hoàn tác.", { danger: true, confirmLabel: "Xóa đơn hàng" })) { onDelete(order.id); onClose(); } }}><Trash2 size={14} /> Xóa</Button>
                <Button variant="primary" onClick={() => setEditing(true)}><Pencil size={14} /> Chỉnh sửa</Button>
              </div>
            )}
          </>
        )
      )}
    </Modal>
  );
}

function OrdersPage({ orders, auditLog, isAdmin, currentUser, onAdd, onUpdate, onDelete, onRestoreSeed }) {
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [modalState, setModalState] = useState(null); // { mode, order }

  const filtered = useMemo(() => {
    return orders.filter(o => {
      const matchesSearch = !search || [o.customer, o.spec, o.materialCode].some(v => (v || "").toLowerCase().includes(search.toLowerCase()));
      if (!matchesSearch) return false;
      if (statusFilter === "all") return true;
      const { statusLabel } = orderProgress(o);
      if (statusFilter === "progress") return statusLabel === "Đang sản xuất";
      if (statusFilter === "done") return statusLabel === "Hoàn thành";
      if (statusFilter === "notstarted") return statusLabel === "Chưa bắt đầu";
      return true;
    });
  }, [orders, search, statusFilter]);

  function handleSave(form, isNew) {
    const cleanedForm = normalizeOrderStages({ ...form, quantity: form.quantity === "" ? null : Number(form.quantity) });
    if (isNew) {
      const newOrder = { ...cleanedForm, id: uid("ORD") };
      onAdd(newOrder);
      setSearch("");
      setStatusFilter("all");
    } else {
      onUpdate(cleanedForm);
    }
  }

  return (
    <div>
      <SectionHeading eyebrow={`${filtered.length} / ${orders.length} đơn hàng`} title="Đơn hàng & theo dõi BOM theo khách hàng" action={isAdmin && (
        <Button variant="primary" onClick={() => setModalState({ mode: "add", order: emptyOrderForm() })}><Plus size={14} /> Thêm đơn hàng</Button>
      )} />
      <div style={{ display: "flex", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: 1, minWidth: 220 }}>
          <Search size={14} style={{ position: "absolute", left: 10, top: 9, color: COLORS.textFaint }} />
          <input className="mes-input" style={{ paddingLeft: 30 }} placeholder="Tìm theo khách hàng, quy cách, mã liệu..." value={search} onChange={e => setSearch(e.target.value)} />
        </div>
        <select className="mes-input" style={{ width: 200 }} value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
          <option value="all">Tất cả trạng thái</option>
          <option value="progress">Đang sản xuất</option>
          <option value="done">Hoàn thành</option>
          <option value="notstarted">Chưa bắt đầu</option>
        </select>
      </div>
      <div className="mes-card mes-scroll-x">
        {filtered.length === 0 ? (
          <EmptyState
            title={orders.length === 0 ? "Chưa có dữ liệu đơn hàng" : "Không tìm thấy đơn hàng phù hợp"}
            hint={orders.length === 0 ? "Danh sách đơn hàng trống — có thể do dữ liệu chưa được nạp đầy đủ." : undefined}
            action={isAdmin && orders.length === 0 && (
              <Button variant="primary" onClick={onRestoreSeed}><RefreshCw size={14} /> Khôi phục 37 đơn hàng mẫu</Button>
            )}
          />
        ) : (
          <table className="mes-table">
            <thead>
              <tr>
                <th>Khách hàng</th><th>Quy cách</th><th>Mã liệu</th><th>Số lượng</th><th>Còn lại</th><th>Tiến trình công đoạn</th><th>Tiến độ</th><th>Trạng thái</th><th></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(o => {
                const prog = orderProgress(o);
                return (
                  <tr key={o.id} style={{ cursor: "pointer" }} onClick={() => setModalState({ mode: "view", order: o })}>
                    <td style={{ fontWeight: 600 }}>{o.customer}</td>
                    <td className="mes-mono">{o.spec}</td>
                    <td>{o.materialCode || "—"}</td>
                    <td className="mes-mono">{fmtNum(o.quantity)}</td>
                    <td className="mes-mono" style={{ color: prog.remainingQty === null ? COLORS.textFaint : prog.remainingQty <= 0 ? COLORS.green : COLORS.amber, fontWeight: 600 }}>
                      {prog.remainingQty === null ? "—" : prog.remainingQty <= 0 ? "Đủ hàng" : fmtNum(prog.remainingQty)}
                    </td>
                    <td><StageMiniBars order={o} /></td>
                    <td style={{ width: 110 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <ProgressBar pct={prog.pct} />
                        <span className="mes-mono" style={{ fontSize: 11, color: COLORS.textDim, flexShrink: 0 }}>{prog.pct === null ? "—" : Math.round(prog.pct) + "%"}</span>
                      </div>
                    </td>
                    <td><Badge color={prog.statusColor}>{prog.statusLabel}</Badge></td>
                    <td><ChevronRight size={15} color={COLORS.textFaint} /></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
      {modalState && (
        <OrderModal
          mode={modalState.mode} order={modalState.order} auditLog={auditLog} isAdmin={isAdmin}
          onClose={() => setModalState(null)} onSave={handleSave} onDelete={onDelete}
        />
      )}
    </div>
  );
}

function ScrapAddModal({ onClose, onSave, currentUser, orders }) {
  const defaultStage = currentUser?.team && TEAM_STAGE_OPTIONS[currentUser.team]?.[0] || STAGES[0].key;
  const [form, setForm] = useState({ date: new Date().toISOString().slice(0, 10), stage: defaultStage, spec: "", customer: "", materialCode: "", qty: "", unit: "kg", reason: "" });
  const [orderId, setOrderId] = useState("");

  const customers = useMemo(() => [...new Set(orders.map(o => o.customer).filter(Boolean))].sort((a, b) => a.localeCompare(b)), [orders]);
  const specs = useMemo(() => [...new Set(orders.map(o => (o.spec !== null && o.spec !== undefined ? String(o.spec) : "")).filter(Boolean))].sort((a, b) => a.localeCompare(b)), [orders]);
  const materialCodes = useMemo(() => [...new Set(orders.map(o => o.materialCode).filter(Boolean))].sort((a, b) => a.localeCompare(b)), [orders]);

  function pickOrder(id) {
    setOrderId(id);
    const o = orders.find(x => x.id === id);
    if (o) setForm(f => ({ ...f, customer: o.customer || "", spec: o.spec !== null && o.spec !== undefined ? String(o.spec) : "", materialCode: o.materialCode || "" }));
  }

  function submit() {
    if (!form.qty || parseFloat(form.qty) <= 0) return;
    onSave({ ...form, id: uid("PL"), qty: parseFloat(form.qty), recordedBy: currentUser.username });
    onClose();
  }
  return (
    <Modal title="Ghi nhận phế liệu" onClose={onClose} width={460}>
      <Field label="Lấy nhanh từ đơn hàng có sẵn (tuỳ chọn)" hint="Chọn để tự điền khách hàng, quy cách & mã liệu, hoặc bỏ qua để tự nhập tay.">
        <select className="mes-input" value={orderId} onChange={e => pickOrder(e.target.value)}>
          <option value="">— Tự nhập tay —</option>
          {orders.map(o => <option key={o.id} value={o.id}>{o.customer} · {o.spec}</option>)}
        </select>
      </Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Field label="Ngày"><input className="mes-input" type="date" value={form.date} onChange={e => setForm(f => ({ ...f, date: e.target.value }))} /></Field>
        <Field label="Công đoạn">
          <select className="mes-input" value={form.stage} onChange={e => setForm(f => ({ ...f, stage: e.target.value }))}>
            {STAGES.map(s => <option key={s.key} value={s.key}>{s.label}</option>)}
          </select>
        </Field>
        <Field label="Khách hàng / Đơn hàng">
          <input className="mes-input" list="mes-scrap-customers" value={form.customer} onChange={e => { setOrderId(""); setForm(f => ({ ...f, customer: e.target.value })); }} placeholder="Chọn hoặc nhập tên khách hàng" />
          <datalist id="mes-scrap-customers">{customers.map(c => <option key={c} value={c} />)}</datalist>
        </Field>
        <Field label="Quy cách">
          <input className="mes-input" list="mes-scrap-specs" value={form.spec} onChange={e => { setOrderId(""); setForm(f => ({ ...f, spec: e.target.value })); }} placeholder="Chọn hoặc nhập quy cách" />
          <datalist id="mes-scrap-specs">{specs.map(s => <option key={s} value={s} />)}</datalist>
        </Field>
        <Field label="Mã liệu (A/B/C...)">
          <input className="mes-input" list="mes-scrap-materials" value={form.materialCode} onChange={e => { setOrderId(""); setForm(f => ({ ...f, materialCode: e.target.value })); }} placeholder="A / B / C..." />
          <datalist id="mes-scrap-materials">{materialCodes.map(m => <option key={m} value={m} />)}</datalist>
        </Field>
        <Field label="Khối lượng phế liệu">
          <div style={{ display: "flex", gap: 6 }}>
            <input className="mes-input" type="number" min="0" step="0.1" value={form.qty} onChange={e => setForm(f => ({ ...f, qty: e.target.value }))} />
            <select className="mes-input" style={{ width: 70 }} value={form.unit} onChange={e => setForm(f => ({ ...f, unit: e.target.value }))}>
              <option value="kg">kg</option><option value="m">m</option><option value="cuộn">cuộn</option>
            </select>
          </div>
        </Field>
      </div>
      <Field label="Nguyên nhân"><textarea className="mes-input" rows={2} value={form.reason} onChange={e => setForm(f => ({ ...f, reason: e.target.value }))} placeholder="ví dụ: đứt dây, lệch quy cách, oxy hoá..." /></Field>
      <Button variant="primary" onClick={submit} style={{ width: "100%", justifyContent: "center" }}><Save size={14} /> Lưu ghi nhận</Button>
    </Modal>
  );
}

function QCPage({ scrap, isAdmin, currentUser, onAdd, onDelete, orders }) {
  const { askConfirm } = useDialog();
  const [showAdd, setShowAdd] = useState(false);
  const byStage = useMemo(() => {
    const m = {};
    STAGES.forEach(s => m[s.key] = 0);
    scrap.forEach(s => { m[s.stage] = (m[s.stage] || 0) + (s.qty || 0); });
    return STAGES.map(s => ({ name: s.short, value: m[s.key] || 0 }));
  }, [scrap]);
  const byStageDetailed = useMemo(() => {
    const scrapByStage = {};
    scrap.forEach(s => { scrapByStage[s.stage] = (scrapByStage[s.stage] || 0) + (s.qty || 0); });
    return STAGES.map(s => {
      const production = (orders || []).reduce((a, o) => a + (o.stages?.[s.key]?.done || 0), 0);
      const scrapQty = scrapByStage[s.key] || 0;
      const pct = production + scrapQty > 0 ? (scrapQty / (production + scrapQty)) * 100 : null;
      return { key: s.key, label: s.label, production, scrapQty, pct };
    });
  }, [scrap, orders]);
  const total = scrap.reduce((a, s) => a + (s.qty || 0), 0);
  const sorted = [...scrap].sort((a, b) => new Date(b.date) - new Date(a.date));

  return (
    <div>
      <SectionHeading eyebrow="Kiểm soát chất lượng" title="Phế liệu & chất lượng sản phẩm" action={
        <Button variant="primary" onClick={() => setShowAdd(true)}><Plus size={14} /> Ghi nhận phế liệu</Button>
      } />
      <div style={{ display: "flex", gap: 14, marginBottom: 18, flexWrap: "wrap" }}>
        <StatCard icon={Recycle} label="Tổng phế liệu" value={`${fmtNum(total)} kg`} sub={`${scrap.length} lượt ghi nhận`} accent={COLORS.red} />
        <div className="mes-card" style={{ padding: 16, flex: 2, minWidth: 320, height: 130 }}>
          <div style={{ fontSize: 11.5, color: COLORS.textDim, fontWeight: 600, marginBottom: 6, textTransform: "uppercase" }}>Phế liệu theo công đoạn</div>
          <ResponsiveContainer width="100%" height={90}>
            <BarChart data={byStage}>
              <XAxis dataKey="name" tick={{ fill: COLORS.textFaint, fontSize: 11 }} axisLine={{ stroke: COLORS.border }} tickLine={false} />
              <YAxis hide />
              <Tooltip contentStyle={{ background: COLORS.bgPanel2, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 12 }} />
              <Bar dataKey="value" fill={COLORS.red} radius={[4, 4, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
      <div className="mes-card mes-scroll-x" style={{ marginBottom: 18 }}>
        <table className="mes-table">
          <thead><tr><th>Công đoạn</th><th style={{ textAlign: "right" }}>Sản lượng (kg)</th><th style={{ textAlign: "right" }}>Phế liệu (kg)</th><th>Tỷ lệ phế liệu</th></tr></thead>
          <tbody>
            {byStageDetailed.map(r => (
              <tr key={r.key}>
                <td style={{ fontWeight: 600 }}>{r.label}</td>
                <td className="mes-mono" style={{ textAlign: "right" }}>{fmtNum(r.production)}</td>
                <td className="mes-mono" style={{ textAlign: "right", color: r.scrapQty > 0 ? COLORS.red : COLORS.textFaint }}>{fmtNum(r.scrapQty)}</td>
                <td style={{ width: 220 }}>
                  {r.pct === null ? <span style={{ color: COLORS.textFaint }}>—</span> : (
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <ProgressBar pct={Math.min(100, r.pct)} color={r.pct > 5 ? COLORS.red : r.pct > 2 ? COLORS.amber : COLORS.green} />
                      <span className="mes-mono" style={{ fontSize: 12.5, fontWeight: 700, color: r.pct > 5 ? COLORS.red : r.pct > 2 ? COLORS.amber : COLORS.green, flexShrink: 0 }}>{r.pct.toFixed(2)}%</span>
                    </div>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr>
              <td style={{ fontWeight: 700, borderTop: `2px solid ${COLORS.border}` }}>Tổng cộng</td>
              <td className="mes-mono" style={{ textAlign: "right", fontWeight: 700, borderTop: `2px solid ${COLORS.border}` }}>{fmtNum(byStageDetailed.reduce((a, r) => a + r.production, 0))}</td>
              <td className="mes-mono" style={{ textAlign: "right", fontWeight: 700, color: COLORS.red, borderTop: `2px solid ${COLORS.border}` }}>{fmtNum(byStageDetailed.reduce((a, r) => a + r.scrapQty, 0))}</td>
              <td className="mes-mono" style={{ fontWeight: 800, color: COLORS.copperBright, borderTop: `2px solid ${COLORS.border}` }}>
                {(() => {
                  const totalProd = byStageDetailed.reduce((a, r) => a + r.production, 0);
                  const totalScrap = byStageDetailed.reduce((a, r) => a + r.scrapQty, 0);
                  return totalProd + totalScrap > 0 ? `${((totalScrap / (totalProd + totalScrap)) * 100).toFixed(2)}%` : "—";
                })()}
              </td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div className="mes-card mes-scroll-x">
        {sorted.length === 0 ? <EmptyState icon={FlaskConical} title="Chưa có dữ liệu phế liệu" /> : (
          <table className="mes-table">
            <thead><tr><th>Ngày</th><th>Công đoạn</th><th>Khách hàng</th><th>Quy cách</th><th>Mã liệu</th><th>Khối lượng</th><th>Nguyên nhân</th><th>Người ghi</th>{isAdmin && <th></th>}</tr></thead>
            <tbody>
              {sorted.map(s => (
                <tr key={s.id}>
                  <td className="mes-mono">{fmtDate(s.date)}</td>
                  <td>{STAGE_MAP[s.stage]?.label || s.stage}</td>
                  <td style={{ fontWeight: 600 }}>{s.customer || "—"}</td>
                  <td className="mes-mono">{s.spec || "—"}</td>
                  <td className="mes-mono">{s.materialCode || "—"}</td>
                  <td className="mes-mono" style={{ color: COLORS.red }}>{fmtNum(s.qty)} {s.unit}</td>
                  <td style={{ color: COLORS.textDim, maxWidth: 220 }}>{s.reason || "—"}</td>
                  <td style={{ color: COLORS.textFaint, fontSize: 12 }}>{s.recordedBy}</td>
                  {isAdmin && <td><IconButton icon={Trash2} danger onClick={async () => { if (await askConfirm("Xóa ghi nhận phế liệu này?", { danger: true, confirmLabel: "Xóa" })) onDelete(s.id); }} title="Xóa" /></td>}
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
      {showAdd && <ScrapAddModal currentUser={currentUser} orders={orders} onClose={() => setShowAdd(false)} onSave={onAdd} />}
    </div>
  );
}

/* ===================== STAFF PAGE ===================== */
function stripAccents(str) { return String(str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
function normHeader(h) { return stripAccents(h).toLowerCase().replace(/[^a-z0-9]/g, ""); }

function aggToSheetRows(agg, colPrefix) {
  const rows = agg.data.map(r => {
    const row = { "Thời gian": r.label };
    agg.materials.forEach(m => { row[`${colPrefix}${m}`] = r[m] || 0; });
    row["Tổng cộng (kg)"] = r.total;
    return row;
  });
  const totalRow = { "Thời gian": "Tổng cộng" };
  agg.materials.forEach(m => { totalRow[`${colPrefix}${m}`] = agg.data.reduce((a, r) => a + (r[m] || 0), 0); });
  totalRow["Tổng cộng (kg)"] = agg.totalKg;
  rows.push(totalRow);
  return rows;
}

function exportKeoTrungReport({ keoTrungWireDay, keoTrungWireWeek, keoTrungWireMonth, keoTrungScrapDay, keoTrungScrapWeek, keoTrungScrapMonth }) {
  const wb = XLSX.utils.book_new();
  const addSheet = (name, agg, prefix) => {
    if (!agg.data.length) return;
    const ws = XLSX.utils.json_to_sheet(aggToSheetRows(agg, prefix));
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  addSheet("SL theo ngay", keoTrungWireDay, "Ma ");
  addSheet("SL theo tuan", keoTrungWireWeek, "Ma ");
  addSheet("SL theo thang", keoTrungWireMonth, "Ma ");
  addSheet("Phe lieu theo ngay", keoTrungScrapDay, "Ma ");
  addSheet("Phe lieu theo tuan", keoTrungScrapWeek, "Ma ");
  addSheet("Phe lieu theo thang", keoTrungScrapMonth, "Ma ");
  if (wb.SheetNames.length === 0) {
    const ws = XLSX.utils.aoa_to_sheet([["Chưa có dữ liệu để xuất"]]);
    XLSX.utils.book_append_sheet(wb, ws, "Trống");
  }
  const today = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `bao_cao_keo_trung_${today}.xlsx`);
}

function StaffImportModal({ onClose, onImport, existingStaff }) {
  const [parsed, setParsed] = useState(null);
  const [mode, setMode] = useState("merge");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const fileInputRef = useRef(null);

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setError(""); setParsed(null); setBusy(true);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const sheetName = wb.SheetNames.find(n => normHeader(n).includes("nhanvien")) || wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];
      const raw = XLSX.utils.sheet_to_json(sheet, { defval: "" });
      if (raw.length === 0) { setError("File không có dữ liệu hoặc sai định dạng."); setBusy(false); return; }
      const sampleKeys = Object.keys(raw[0]);
      const keyMap = {};
      sampleKeys.forEach(k => {
        const n = normHeader(k);
        if (!keyMap.code && /^ma/.test(n)) keyMap.code = k;
        else if (!keyMap.name && /(hoten|hovaten|^ten)/.test(n)) keyMap.name = k;
        else if (!keyMap.team && /^to/.test(n)) keyMap.team = k;
        else if (!keyMap.shift && /^ca/.test(n)) keyMap.shift = k;
        else if (!keyMap.status && /trang/.test(n)) keyMap.status = k;
      });
      if (!keyMap.name) {
        setError('Không tìm thấy cột "Họ và tên" trong file. Vui lòng dùng đúng file mẫu (bấm "Tải file mẫu" bên dưới).');
        setBusy(false);
        return;
      }
      const rows = raw.map(r => {
        const name = String(r[keyMap.name] || "").trim();
        const teamRaw = stripAccents(String(r[keyMap.team] || "").trim()).toUpperCase();
        const team = TEAMS.find(t => stripAccents(t).toUpperCase() === teamRaw) || TEAMS.find(t => teamRaw && stripAccents(t).toUpperCase().includes(teamRaw)) || TEAMS[0];
        const shiftRaw = stripAccents(String(r[keyMap.shift] || "")).toLowerCase();
        const shift = shiftRaw.includes("dem") ? "Ca đêm" : "Ca ngày";
        const statusRaw = stripAccents(String(r[keyMap.status] || "")).toLowerCase();
        let status = "Đang làm";
        if (statusRaw.includes("phep")) status = "Nghỉ phép";
        else if (statusRaw.includes("nghi") || statusRaw.includes("thoi")) status = "Đã nghỉ";
        const code = String(r[keyMap.code] || "").trim() || uid("NV");
        return { code, name, team, shift, status };
      }).filter(r => r.name);
      if (rows.length === 0) { setError("Không đọc được dòng nhân viên hợp lệ nào (cần có Họ và tên)."); setBusy(false); return; }
      setParsed({ rows, fileName: file.name, missingCols: ["code", "team", "shift", "status"].filter(k => !keyMap[k]) });
    } catch (err) {
      setError("Không đọc được file. Hãy chắc chắn đây là file Excel (.xlsx/.xls) hợp lệ.");
    } finally {
      setBusy(false);
    }
  }

  const updateCount = parsed ? parsed.rows.filter(r => existingStaff.some(s => s.code === r.code)).length : 0;
  const newCount = parsed ? parsed.rows.length - updateCount : 0;

  return (
    <Modal title="Tải lên danh sách nhân viên từ file Excel" onClose={onClose} width={620}>
      {!parsed ? (
        <>
          <div style={{ border: `1.5px dashed ${COLORS.border}`, borderRadius: 10, padding: "28px 18px", textAlign: "center", marginBottom: 14 }}>
            <FileSpreadsheet size={28} color={COLORS.copper} style={{ marginBottom: 8 }} />
            <div style={{ fontSize: 13, color: COLORS.textDim, marginBottom: 12 }}>Chọn file Excel (.xlsx) danh sách nhân viên tháng này</div>
            <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={handleFile} />
            <Button variant="primary" onClick={() => fileInputRef.current?.click()} disabled={busy}>
              {busy ? <Loader2 size={14} className="pulse-dot" /> : <Upload size={14} />} Chọn file
            </Button>
          </div>
          {error && <div style={{ color: COLORS.red, fontSize: 12.5, marginBottom: 12 }}>{error}</div>}
          <div style={{ fontSize: 12, color: COLORS.textFaint, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
            <span>File cần có cột: <b>Mã NV, Họ và tên, Tổ sản xuất, Tình trạng</b> (không phân biệt thứ tự cột).</span>
            <button type="button" onClick={downloadStaffTemplate} className="mes-btn mes-btn-ghost" style={{ fontSize: 12, flexShrink: 0 }}><Download size={13} /> Tải file mẫu</button>
          </div>
        </>
      ) : (
        <>
          <div style={{ display: "flex", gap: 14, marginBottom: 14, flexWrap: "wrap" }}>
            <Badge color={COLORS.blue}>{parsed.rows.length} dòng đọc được</Badge>
            <Badge color={COLORS.green}>{newCount} nhân viên mới</Badge>
            <Badge color={COLORS.amber}>{updateCount} sẽ cập nhật (trùng mã NV)</Badge>
          </div>
          {parsed.missingCols.length > 0 && (
            <div style={{ fontSize: 12, color: COLORS.amber, marginBottom: 10 }}>
              Lưu ý: không tìm thấy cột {parsed.missingCols.join(", ")} trong file — các dòng thiếu sẽ dùng giá trị mặc định.
            </div>
          )}
          <div className="mes-scroll-x" style={{ maxHeight: 280, overflowY: "auto", border: `1px solid ${COLORS.border}`, borderRadius: 8, marginBottom: 14 }}>
            <table className="mes-table">
              <thead><tr><th>Mã NV</th><th>Họ và tên</th><th>Tổ</th><th>Tình trạng</th></tr></thead>
              <tbody>
                {parsed.rows.slice(0, 100).map((r, i) => (
                  <tr key={i}>
                    <td className="mes-mono">{r.code}</td>
                    <td style={{ fontWeight: 600 }}>{r.name}</td>
                    <td>{r.team}</td>
                    <td>{r.status}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <Field label="Chế độ nhập dữ liệu">
            <div style={{ display: "flex", gap: 8 }}>
              <button type="button" onClick={() => setMode("merge")} className="mes-btn" style={{ flex: 1, justifyContent: "center", borderColor: mode === "merge" ? COLORS.copper : COLORS.border, background: mode === "merge" ? `${COLORS.copper}22` : COLORS.bgPanel2, color: mode === "merge" ? COLORS.copperBright : COLORS.textDim }}>
                Cập nhật / Thêm mới (giữ danh sách cũ)
              </button>
              <button type="button" onClick={() => setMode("replace")} className="mes-btn" style={{ flex: 1, justifyContent: "center", borderColor: mode === "replace" ? COLORS.red : COLORS.border, background: mode === "replace" ? `${COLORS.red}22` : COLORS.bgPanel2, color: mode === "replace" ? "#FFB4AF" : COLORS.textDim }}>
                Thay thế toàn bộ danh sách
              </button>
            </div>
          </Field>
          {mode === "replace" && <div style={{ fontSize: 12, color: COLORS.red, marginBottom: 10 }}>Toàn bộ {existingStaff.length} nhân viên hiện tại sẽ bị xóa và thay bằng {parsed.rows.length} dòng trong file.</div>}
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <Button onClick={() => setParsed(null)}>Chọn file khác</Button>
            <Button variant="primary" onClick={() => { onImport(parsed.rows, mode); onClose(); }}><Upload size={14} /> Xác nhận nhập {parsed.rows.length} dòng</Button>
          </div>
        </>
      )}
    </Modal>
  );
}

function AttendanceSection({ staff, attendance, onUpdate }) {
  const today = new Date().toISOString().slice(0, 10);
  const [date, setDate] = useState(today);
  const [filterTeam, setFilterTeam] = useState("all");

  const dayKey = date;
  const dayData = attendance[dayKey] || {};

  function getStatus(staffId) { return dayData[staffId] || {}; }

  // ===== Export helpers =====
  function getDaysInRange(start, end) {
    const days = []; const cur = new Date(start);
    while (cur <= new Date(end)) { days.push(cur.toISOString().slice(0, 10)); cur.setDate(cur.getDate() + 1); }
    return days;
  }
  function getWeekRange(d) {
    const dt = new Date(d + "T00:00:00");
    const day = dt.getDay(); const diff = day === 0 ? -6 : 1 - day;
    const mon = new Date(dt); mon.setDate(dt.getDate() + diff);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return [mon.toISOString().slice(0, 10), sun.toISOString().slice(0, 10)];
  }
  function getMonthRange(d) {
    const [y, m] = d.split("-");
    return [`${y}-${m}-01`, new Date(y, Number(m), 0).toISOString().slice(0, 10)];
  }

  function buildSheet(days, label) {
    const STATUS_LABELS = ATTENDANCE_STATUSES.map(s => s.label);
    const activeTeams = TEAMS.filter(t => staff.some(s => s.team === t));
    const aoa = [];

    // === PHẦN 1: Tiêu đề ===
    aoa.push([`BÁO CÁO ĐIỂM DANH — ${label.toUpperCase()}`]);
    aoa.push([]);

    // === PHẦN 2: Bảng tổng theo tổ ===
    const sumHeader = ["Tổ", "Sĩ số", ...STATUS_LABELS];
    aoa.push(sumHeader);
    let grandTotal = { count: 0 };
    STATUS_LABELS.forEach(l => grandTotal[l] = 0);
    activeTeams.forEach(team => {
      const members = staff.filter(s => s.team === team);
      const teamRow = [`Tổ ${team}`, members.length];
      ATTENDANCE_STATUSES.forEach(a => {
        let cnt = 0;
        days.forEach(d => { cnt += members.filter(m => ((attendance[d] || {})[m.id] || {})[a.key]).length; });
        teamRow.push(cnt || "—");
        grandTotal[a.label] = (grandTotal[a.label] || 0) + (cnt || 0);
      });
      grandTotal.count += members.length;
      aoa.push(teamRow);
    });
    const totalRow = ["Tổng cộng", grandTotal.count, ...ATTENDANCE_STATUSES.map(a => grandTotal[a.label] || "—")];
    aoa.push(totalRow);
    aoa.push([]);
    aoa.push([]);

    // === PHẦN 3: Chi tiết từng tổ ===
    const detailHeader = ["Mã NV", "Họ và tên", ...days.flatMap(d => STATUS_LABELS.map(l => days.length > 1 ? `${l} (${d})` : l))];
    aoa.push(detailHeader);

    activeTeams.forEach(team => {
      const members = staff.filter(s => s.team === team);
      // Team separator row
      aoa.push([`Tổ ${team.toUpperCase()} (${members.length} người)`, ...Array(detailHeader.length - 1).fill("")]);
      members.forEach(m => {
        const row = [m.code, m.name];
        days.forEach(d => {
          const st = (attendance[d] || {})[m.id] || {};
          ATTENDANCE_STATUSES.forEach(a => row.push(st[a.key] ? "✓" : ""));
        });
        aoa.push(row);
      });
      // Team sub-total
      const sub = [`Tổng Tổ ${team}`, ""];
      days.forEach(d => {
        ATTENDANCE_STATUSES.forEach(a => {
          sub.push(members.filter(m => ((attendance[d] || {})[m.id] || {})[a.key]).length || "");
        });
      });
      aoa.push(sub);
      aoa.push([]);
    });

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    // Column widths
    ws["!cols"] = [{ wch: 13 }, { wch: 22 }, ...days.flatMap(() => ATTENDANCE_STATUSES.map(() => ({ wch: 11 })))];
    return ws;
  }

  function exportExcel(mode) {
    let days, label, fileName;
    if (mode === "day") {
      days = [date];
      label = `Điểm danh ngày ${date}`;
      fileName = `diemdanh_${date}.xlsx`;
    } else if (mode === "week") {
      const [start, end] = getWeekRange(date);
      days = getDaysInRange(start, end);
      label = `Điểm danh tuần ${start} → ${end}`;
      fileName = `diemdanh_tuan_${start}.xlsx`;
    } else {
      const [start, end] = getMonthRange(date);
      days = getDaysInRange(start, end);
      label = `Điểm danh tháng ${date.slice(0, 7)}`;
      fileName = `diemdanh_thang_${date.slice(0, 7)}.xlsx`;
    }
    const wb = XLSX.utils.book_new();
    // Sheet 1: Full layout
    XLSX.utils.book_append_sheet(wb, buildSheet(days, label), label.slice(0, 31));
    XLSX.writeFile(wb, fileName);
  }

  function toggleStatus(staffId, key, val) {
    const current = getStatus(staffId);
    const updated = { ...current };
    if (key === "caNgay" && val) { delete updated.caDem; }
    if (key === "caDem" && val) { delete updated.caNgay; }
    if (val) updated[key] = true; else delete updated[key];
    const newDayData = { ...dayData, [staffId]: Object.keys(updated).length ? updated : undefined };
    if (!newDayData[staffId]) delete newDayData[staffId];
    onUpdate(dayKey, newDayData);
  }

  function setAllShift(shiftKey, teamFilter) {
    const targetStaff = teamFilter === "all" ? staff : staff.filter(s => s.team === teamFilter);
    const newDayData = { ...dayData };
    targetStaff.forEach(s => {
      const current = newDayData[s.id] || {};
      const updated = { ...current };
      if (shiftKey === "caNgay") delete updated.caDem;
      if (shiftKey === "caDem") delete updated.caNgay;
      updated[shiftKey] = true;
      newDayData[s.id] = updated;
    });
    onUpdate(dayKey, newDayData);
  }

  const activeTeams = TEAMS.filter(t => staff.some(s => s.team === t));
  const displayTeams = filterTeam === "all" ? activeTeams : [filterTeam];

  const allFilteredStaff = filterTeam === "all" ? staff : staff.filter(s => s.team === filterTeam);

  const summary = useMemo(() => {
    const m = {};
    ATTENDANCE_STATUSES.forEach(s => m[s.key] = 0);
    allFilteredStaff.forEach(s => {
      const st = getStatus(s.id);
      ATTENDANCE_STATUSES.forEach(a => { if (st[a.key]) m[a.key]++; });
    });
    return m;
  }, [dayData, allFilteredStaff]);

  const COL_HEADER_STYLE = {
    position: "sticky", top: 0, background: COLORS.bgPanel2, zIndex: 10,
    textAlign: "center", fontSize: 10, whiteSpace: "nowrap",
    borderBottom: `2px solid ${COLORS.border}`,
  };

  return (
    <div>
      {/* Controls */}
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
        <input className="mes-input" type="date" value={date} onChange={e => setDate(e.target.value)} style={{ width: 170 }} />
        <select className="mes-input" style={{ width: 170 }} value={filterTeam} onChange={e => setFilterTeam(e.target.value)}>
          <option value="all">Tất cả tổ</option>
          {activeTeams.map(t => <option key={t} value={t}>Tổ {t}</option>)}
        </select>
        <Button onClick={() => setAllShift("caNgay", filterTeam)} style={{ fontSize: 12 }}>☀️ Ca Ngày</Button>
        <Button onClick={() => setAllShift("caDem", filterTeam)} style={{ fontSize: 12 }}>🌙 Ca Đêm</Button>
        <div style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
          <button type="button" onClick={() => exportExcel("day")} style={{ fontSize: 12, padding: "7px 12px", borderRadius: 8, border: `1px solid ${COLORS.green}`, background: `${COLORS.green}18`, color: COLORS.green, cursor: "pointer", fontWeight: 600, display: "flex", alignItems: "center", gap: 5 }}>
            <FileSpreadsheet size={13} /> Xuất ngày
          </button>
          <button type="button" onClick={() => exportExcel("week")} style={{ fontSize: 12, padding: "7px 12px", borderRadius: 8, border: `1px solid ${COLORS.blue}`, background: `${COLORS.blue}18`, color: COLORS.blue, cursor: "pointer", fontWeight: 600, display: "flex", alignItems: "center", gap: 5 }}>
            <FileSpreadsheet size={13} /> Xuất tuần
          </button>
          <button type="button" onClick={() => exportExcel("month")} style={{ fontSize: 12, padding: "7px 12px", borderRadius: 8, border: `1px solid ${COLORS.copper}`, background: `${COLORS.copper}18`, color: COLORS.copperBright, cursor: "pointer", fontWeight: 600, display: "flex", alignItems: "center", gap: 5 }}>
            <FileSpreadsheet size={13} /> Xuất tháng
          </button>
        </div>
      </div>

      {/* Summary per team */}
      <div className="mes-scroll-x" style={{ marginBottom: 16 }}>
        <table style={{ minWidth: 680, borderCollapse: "collapse", width: "100%", background: COLORS.bgPanel2, borderRadius: 10, overflow: "hidden", border: `1px solid ${COLORS.border}` }}>
          <thead>
            <tr style={{ background: COLORS.bgInset }}>
              <th style={{ textAlign: "left", padding: "8px 14px", fontSize: 11, fontWeight: 700, color: COLORS.textDim, textTransform: "uppercase", borderBottom: `1px solid ${COLORS.border}`, whiteSpace: "nowrap" }}>Tổ</th>
              <th style={{ textAlign: "center", padding: "8px 6px", fontSize: 10, fontWeight: 700, color: COLORS.textDim, borderBottom: `1px solid ${COLORS.border}` }}>Sĩ số</th>
              {ATTENDANCE_STATUSES.map(s => (
                <th key={s.key} style={{ textAlign: "center", padding: "6px 4px", fontSize: 10, color: s.color, fontWeight: 700, borderBottom: `1px solid ${COLORS.border}`, whiteSpace: "nowrap" }}>
                  {s.icon} {s.label}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {displayTeams.map(team => {
